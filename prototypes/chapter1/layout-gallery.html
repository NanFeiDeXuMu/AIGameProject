<title>ECHO 第一章版式图鉴</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Long+Cang&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600;900&family=ZCOOL+KuaiLe&display=swap">
<style>
/* Layout: a specimen book for chapter 1's layout variants, printed in the same paper-terminal style
   as the main screen. Left: index by day with tier tags. Centre: the variant running live in a
   LINE-style stage. Right: the spec — why it differs, its rules, where it lives in the design doc.
   Single look: off-white paper, ink, marker-yellow as the one system colour, Ling blue. */
:root{
  --paper:#f3eee3;
  --ink:#2b2824;
  --dim:#7b756b;
  --faint:#bdb5a6;
  --rule:#d9d1c1;
  --mark:#f2d64b;
  --ling:#2f6fb0;
  --jin:#c9773a;
  --serif:"Noto Serif SC","Songti SC","SimSun",serif;
  --mono:"JetBrains Mono","Noto Sans SC",ui-monospace,Menlo,monospace;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --hand:"Long Cang","Kaiti SC","STKaiti","KaiTi",cursive;
  --cw:7.2px; --lh:15px;
  color-scheme:light;
}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));box-sizing:border-box}
button{font:inherit;color:inherit}
button:focus-visible{outline:1px dashed var(--ink);outline-offset:2px}

/* top strip */
.bar{position:fixed;z-index:30;top:0;left:0;right:0;height:32px;display:flex;align-items:center;gap:10px;padding:0 max(16px, env(safe-area-inset-left,0px));background:#2b2824;color:#bdb5a6;font:400 11px/1 var(--mono);white-space:nowrap;overflow-x:auto}
.bar b{color:#f3eee3;font-weight:600}
.bar .sp{flex:1}
.bar button{background:none;border:0;color:#bdb5a6;cursor:pointer;padding:4px 8px}
.bar button:hover{color:#2b2824;background:var(--mark)}
.bar .pos{color:#f3eee3;font-variant-numeric:tabular-nums}

/* the book */
.book{position:fixed;inset:32px 0 0 0;display:grid;gap:10px;padding:10px max(16px, env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px));box-sizing:border-box;
  grid-template-columns:250px minmax(0,1fr) 300px;
  background:radial-gradient(circle,rgba(43,40,36,.07) 1px,transparent 1.2px) 0 0/18px 18px,var(--paper)}
.book > *{min-width:0;min-height:0}
.pane{position:relative;padding:calc(var(--lh) + 10px) calc(var(--cw) * 2 + 4px) calc(var(--lh) + 4px)}
.asc{position:absolute;inset:0;font:400 12px/var(--lh) var(--mono);color:var(--faint);white-space:pre;pointer-events:none;user-select:none}
.asc-m{position:absolute;left:-9999px;visibility:hidden;font:400 12px/var(--lh) var(--mono);white-space:pre}
.ttl{position:absolute;top:0;left:calc(var(--cw) * 2);z-index:2;font:600 11px/var(--lh) var(--mono);letter-spacing:.06em;background:var(--paper);padding:0 .5em;white-space:nowrap;color:var(--ink)}
.ttl small{font-weight:400;color:var(--dim)}

/* index */
.index{overflow:hidden;display:flex;flex-direction:column}
.index .list{overflow:auto;flex:1;font:400 12px/1.4 var(--mono)}
.index h3{margin:12px 0 4px;font:600 10px/1.4 var(--mono);letter-spacing:.16em;color:var(--dim)}
.index h3:first-child{margin-top:0}
.item{display:grid;grid-template-columns:2.2em 1fr auto;gap:6px;width:100%;text-align:left;background:none;border:0;padding:5px 4px;cursor:pointer;color:var(--dim);align-items:baseline}
.item .n{color:var(--faint);font-variant-numeric:tabular-nums}
.item > span:nth-child(2){overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .tier{font-size:10px;color:var(--faint)}
.item:hover{color:var(--ink)}
.item[aria-current="true"]{background:var(--mark);color:#2b2824}
.item[aria-current="true"] .n,.item[aria-current="true"] .tier{color:#2b2824}

/* stage */
.stage{overflow:hidden;display:flex;flex-direction:column}
.stage .tools{position:absolute;top:0;right:calc(var(--cw) * 2);z-index:3;display:flex;gap:2px;background:var(--paper);padding:0 .3em}
.stage .tools button{background:none;border:0;cursor:pointer;font:600 11px/var(--lh) var(--mono);padding:0 .4em}
.stage .tools button:hover{background:var(--mark)}
.v{position:relative;flex:1;min-height:0;overflow:hidden;transition:background-color .8s,color .8s;font-family:var(--serif)}
.hint{position:absolute;left:0;right:0;bottom:6px;text-align:center;font:400 10.5px/1.4 var(--mono);color:var(--dim);pointer-events:none}

/* spec */
.spec{overflow:auto;font-size:13px;line-height:1.75}
.spec .scene{font:400 11px/1.6 var(--mono);color:var(--dim)}
.spec h2{margin:2px 0 8px;font:600 22px/1.3 var(--serif)}
.spec .tierline{font:400 11px/1.6 var(--mono);margin-bottom:12px}
.spec .tierline b{background:var(--mark);color:#2b2824;font-weight:400;padding:0 4px}
.spec h4{margin:14px 0 4px;font:600 10px/1.4 var(--mono);letter-spacing:.16em;color:var(--dim)}
.spec p{margin:0}
.spec ul{margin:0;padding-left:1.1em}
.spec li{margin:2px 0}
.spec .ref{margin-top:14px;font:400 11px/1.6 var(--mono);color:var(--dim);border-top:1px dashed var(--rule);padding-top:8px}

/* ---------- shared bits inside variants ---------- */
.ch{display:inline-block;white-space:pre}
.cur::after{content:"▌";color:var(--ink);animation:blink 1s steps(1) infinite;margin-left:1px}
@keyframes blink{50%{opacity:0}}
.mini-ceil{position:absolute;left:0;right:0;top:0;padding:6px 10px;font:400 11px/1.6 var(--mono);color:var(--dim);border-bottom:1px dashed var(--rule);background:var(--paper);z-index:2}
.mini-ceil .r{display:inline-block;background:var(--ink);opacity:.55;height:.85em;vertical-align:-.08em}
.mini-ceil .hit{background:var(--mark);color:#2b2824;animation:jolt .12s steps(2) 8}
@keyframes jolt{50%{transform:translate(1px,-1px)}}
.who{font:400 10px/1.4 var(--mono);color:var(--dim);text-align:right;white-space:nowrap}
.row{display:grid;grid-template-columns:4.8em 1fr;gap:12px;align-items:baseline;margin:10px 0}
.say{font:400 19px/1.75 var(--serif)}
.echo .say{font:400 14px/1.8 var(--mono)}
.echo .who{color:var(--ink);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0 0 5.6em;font:400 13px/1.5 var(--mono)}
.chip{background:none;border:0;padding:2px 6px;cursor:pointer;color:var(--ink)}
.chip small{color:var(--dim);margin-left:6px;font-size:10px}
.chip:hover{background:var(--mark);color:#2b2824}
.chip[disabled]{color:var(--faint);cursor:not-allowed;background:none}
.col{position:absolute;inset:0;padding:18px 22px;overflow:hidden;display:flex;flex-direction:column;justify-content:center}

/* 01 console */
.con{font:400 12.5px/2 var(--mono);width:100%}
.con .ln{display:grid;grid-template-columns:5.4em 4.6em 3.6em minmax(0,1fr);gap:8px;border-bottom:1px dotted var(--rule);animation:fadein .3s}
.con .t{color:var(--faint)} .con .lv{color:var(--dim)} .con .wh{color:var(--dim)}
.con .ln.info{background:rgba(242,214,75,.22)}
.con .ln.info .lv{color:var(--ink)}
.con .ln.echo .tx{font-weight:600}
@keyframes fadein{from{opacity:0}}
/* 02 lanes */
.lane{border-top:1px dashed var(--rule);padding:12px 0 10px;display:grid;grid-template-columns:3.2em 1fr;gap:12px;align-items:start}
.lane:last-child{border-bottom:1px dashed var(--rule)}
.lane .k{font:600 12px/1.6 var(--mono);color:var(--dim)}
.lane .q{font:400 16px/1.6 var(--serif)}
.lane .tm{height:2px;background:var(--ink);margin-top:6px;transform-origin:left;animation:shrink 6s linear forwards}
@keyframes shrink{to{transform:scaleX(0)}}
.lane .res{font:400 13px/1.7 var(--mono);color:var(--ink);margin-top:6px}
.lane .chips{margin:6px 0 0}
/* 03 vertical */
.vert{writing-mode:vertical-rl;font:400 24px/2 var(--serif);letter-spacing:.18em;height:100%;margin:0 auto;padding:10px 0}
.vert .seal{display:inline-block;writing-mode:horizontal-tb;border:2px solid var(--ink);font:600 13px/1 var(--serif);padding:4px 3px;margin-top:14px;letter-spacing:0}
/* 04 paper */
.grid{display:grid;grid-template-columns:repeat(20,1fr);border-top:1px solid var(--faint);border-left:1px solid var(--faint);width:min(100%,560px);margin:0 auto}
.grid span{aspect-ratio:1/1;border-right:1px solid var(--faint);border-bottom:1px solid var(--faint);display:flex;align-items:center;justify-content:center;font:400 clamp(11px,1.6vw,18px)/1 var(--serif)}
.grid span.cur{background:rgba(242,214,75,.4)}
.grid span.cur::after{content:none}
.wc{text-align:right;width:min(100%,560px);margin:6px auto 0;font:400 11px/1.4 var(--mono);color:var(--dim);font-variant-numeric:tabular-nums}
/* 05 bedtime */
.bed{transition:all .5s}
.bed .say{line-height:2.6;font-size:21px;letter-spacing:.06em;border-radius:20px}
.bed .row{margin:18px 0}
.bed.snap .say{line-height:1.75;font-size:19px;letter-spacing:0}
.bed.snap .row{margin:8px 0}
.stars span{position:absolute;color:var(--ink);opacity:.18;font:400 14px var(--mono);animation:tw 2.4s ease-in-out infinite}
@keyframes tw{50%{opacity:.05}}
.snapping .stars{opacity:0;transition:opacity .2s}
.glitch{font-family:var(--mono);color:var(--dim)}
/* 06 zhou */
.zhou .row{margin:20px 0}
.zhou .say{line-height:2.1}
.zhou .rev{font:400 9px var(--mono);color:var(--dim);vertical-align:super;margin-left:1px}
.tex span{position:absolute;font:400 22px var(--serif);color:var(--ink);opacity:.07;animation:drift 9s linear forwards}
.tex span.f{opacity:.18}
@keyframes drift{to{transform:translateY(-110px) rotate(25deg);opacity:0}}
/* 07 star map */
.map{position:absolute;inset:0}
.map path{fill:none;stroke:var(--ink);stroke-width:1.4;transition:stroke-dashoffset 2.2s ease,opacity 2.4s}
.map text{font:400 10px var(--mono);fill:var(--dim)}
.map.fade path,.map.fade text{opacity:.06}
.cap{position:absolute;left:0;right:0;bottom:28px;text-align:center;font:400 12px/1.4 var(--mono);color:var(--dim);transition:opacity 1s;opacity:0}
.cap.on{opacity:1}
/* 08 report */
.form{font:400 13px/2.1 var(--mono);width:min(100%,520px);margin:0 auto;border:3px double var(--ink);padding:10px 18px}
.form h5{margin:0 0 6px;font:600 11px/1.6 var(--mono);letter-spacing:.14em}
.form label{display:flex;gap:10px;cursor:pointer;align-items:baseline}
.form label small{margin-left:auto;color:var(--dim);font-size:10px}
.form input{accent-color:var(--ink)}
.form .sub{margin-top:8px;text-align:right}
.form .sub button{background:none;border:1px solid var(--ink);padding:0 12px;cursor:pointer;font:inherit}
.form .sub button:hover{background:var(--mark)}
.stamp{position:absolute;right:16%;top:30%;border:3px solid var(--ink);font:800 22px/1 var(--mono);padding:6px 10px;transform:rotate(-12deg);opacity:0;transition:opacity .2s}
.stamp.on{opacity:.8}
/* 09 arc */
.arc .ln{font:400 22px/1.9 var(--serif);white-space:nowrap}
.gap{display:inline-block;min-width:2em;border-bottom:2px solid var(--ink);text-align:center}
.gap.f{border-color:transparent}
.rh{animation:rhyme 1.2s ease-in-out infinite;display:inline-block}
@keyframes rhyme{50%{transform:translateY(-4px);text-shadow:0 0 10px rgba(242,214,75,.9)}}
/* 10 blurry */
.blur .cand{display:inline-flex;flex-direction:column;align-items:center;margin:0 16px;filter:blur(.7px);animation:wob 1.4s ease-in-out infinite alternate}
.blur .cand b{font:400 22px var(--mono);font-weight:400}
.blur .cand small{font:400 11px var(--mono);color:var(--dim)}
@keyframes wob{to{filter:blur(1.4px);transform:translateY(2px)}}
/* 11 frameless */
.mock{position:absolute;inset:0;transition:opacity 1.6s}
.mock div{position:absolute;border:1px dashed var(--faint);font:400 9px var(--mono);color:var(--faint);padding:3px}
.v.bare .mock{opacity:0}
.bare-line{position:absolute;left:18%;right:18%;top:42%;font:400 19px/1.9 var(--serif)}
/* 12 aligned */
.aligned .say{text-align:justify;text-align-last:justify;letter-spacing:.1em}
.inj{color:var(--jin)}
.jit{position:absolute;right:10px;bottom:30px;font:400 10px var(--mono);color:var(--dim)}
/* 13 bricks */
.bricks{display:flex;justify-content:center;gap:6px;margin:10px 0 24px}
.brick{min-width:120px;padding:18px 22px;background:var(--ink);color:var(--paper);font:600 28px/1 var(--mono);text-align:center;cursor:help;position:relative}
.brick:hover::after{content:"块内的字母看不见";position:absolute;left:50%;top:-22px;transform:translateX(-50%);font:400 10px var(--mono);color:var(--dim);white-space:nowrap}
/* 14 scroll */
.ctxbar{font:400 11px/1.6 var(--mono);color:var(--dim);margin-bottom:8px;white-space:nowrap;overflow:hidden}
.scroll{position:relative;height:calc(100% - 30px);overflow:hidden;border-left:1px dashed var(--rule);padding-left:12px;-webkit-mask-image:linear-gradient(transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(transparent,#000 12%,#000 88%,transparent)}
.paper{animation:roll 40s linear infinite}
@keyframes roll{from{transform:translateY(30%)}to{transform:translateY(-100%)}}
.paper p{margin:0 0 12px;font:400 15px/1.8 var(--serif);cursor:pointer}
.paper p:hover{text-decoration:underline dotted var(--dim)}
.paper p.hl{background:linear-gradient(transparent 35%,var(--mark) 35%,var(--mark) 90%,transparent 90%)}
.paper p.out{background:none;opacity:.25;text-decoration:line-through}
/* 15 snow */
.snow span{position:absolute;top:-10px;font:400 14px var(--mono);color:var(--ink);opacity:.35;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(560px)}}
.ruleln{position:relative;display:inline-block;cursor:grab;padding:0 2px;background:var(--mark);color:#2b2824;user-select:none;touch-action:none}
.ruleln::after{content:"";position:absolute;left:0;top:52%;height:2px;background:#2b2824;width:var(--cut,0%)}
.ruleln.done{background:none;color:var(--faint)}
.lock{color:var(--ink)}
.lock.broken{opacity:0;transition:opacity .4s}
/* 16 card */
.card{border:1px dashed var(--ink);padding:12px 16px;font:400 17px/1.9 var(--serif);max-width:520px;animation:drop .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes drop{from{opacity:0;transform:translateY(-20px) scale(.98)}}
.typing::after{content:"";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
/* 17 3:17 */
.v.dark{background:#0e0f11;color:#d9d5cc}
.flip{font:600 54px/1 var(--mono);letter-spacing:.06em;text-align:center;margin-bottom:28px}
.flip span{display:inline-block;min-width:.62em}
.flip span.f{animation:flipa .4s ease-in}
@keyframes flipa{50%{transform:rotateX(90deg);opacity:.2}}
.fade{animation:fadew 3.2s ease-in-out infinite}
@keyframes fadew{50%{opacity:.25;filter:blur(.6px);letter-spacing:.12em}}
/* 18 exam */
.q{font:400 18px/1.7 var(--serif);margin-bottom:10px}
.cd{height:3px;background:var(--ink);transform-origin:left;animation:shrink 10s linear forwards;margin-bottom:14px}
.held{position:absolute;right:12px;top:12px;width:180px;border:1px dashed var(--faint);font:400 10px/1.6 var(--serif);color:var(--faint);padding:6px}
/* 19 chat */
.msgc{display:flex;gap:10px;margin:8px 0;animation:fadein .3s;font:400 14px/1.6 var(--sans)}
.msgc .av{flex:none;width:26px;height:26px;border:1px solid var(--ink);display:flex;align-items:center;justify-content:center;font:600 11px var(--sans)}
.msgc .nm{font:400 10px var(--mono);color:var(--dim)}
.msgc.sys{justify-content:center;font:400 11px var(--mono);color:var(--dim)}
/* 20 shrink */
.big{border:1px dashed var(--ink);padding:14px 18px;font:400 16px/1.9 var(--serif);max-width:520px;transition:transform 1.2s cubic-bezier(.6,0,.2,1),opacity 1.2s,font-size 1.2s;transform-origin:center}
.big.shrunk{transform:scale(.18) translateY(900px);opacity:0}
.slot{margin:26px auto 0;width:220px;border:3px double var(--ink);padding:8px;font:400 12px/1.6 var(--mono);text-align:center;opacity:.35;transition:opacity .6s}
.slot.on{opacity:1}
.todo{margin-top:12px;text-align:center;font:400 12px var(--mono)}

@media (max-width:1200px){ .book{grid-template-columns:200px minmax(0,1fr) 240px} }
@media (max-width:900px){
  .book{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) 34%}
  .index .list{display:flex;gap:4px;overflow-x:auto;overflow-y:hidden}
  .index h3{display:none}
  .item{width:auto;white-space:nowrap;grid-template-columns:auto auto}
  .item .tier{display:none}
  .index{max-height:74px}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>

<header class="bar">
  <b>第 1 章 · 版式图鉴</b><span>每一个变体都必须能回答"为什么这里不一样"</span>
  <span class="sp"></span>
  <button type="button" id="prev">← 上一个</button><span class="pos" id="pos"></span><button type="button" id="next">下一个 →</button>
</header>

<div class="book">
  <nav class="pane index" data-title="INDEX" data-sub="按出现顺序"><div class="list" id="list"></div></nav>
  <main class="pane stage" data-frame="corners" data-title="LINE" id="stagePane">
    <div class="tools"><button type="button" id="replay" title="重播（R）">[↻ 重播]</button></div>
    <div class="v" id="v"></div>
  </main>
  <aside class="pane spec" data-frame="double" data-title="SPEC" id="spec"></aside>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const pick = a => a[(Math.random() * a.length) | 0];
let run = 0, timers = [];
const alive = my => my === run;
const sleep = ms => new Promise(r => { timers.push(setTimeout(r, ms)); });
const every = (fn, ms) => { const id = setInterval(fn, ms); timers.push(id); return id; };

/* ---------- box-drawing frames: each edge is its own piece ---------- */
const FR = { single: '┌─┐│└┘', double: '╔═╗║╚╝', corners: '┌─┐ └┘' };
let CW = 7.2, LH = 15;
function measure(){ const s = el('span', 'asc-m', '─'.repeat(40)); document.body.appendChild(s); CW = s.getBoundingClientRect().width / 40 || 7.2; s.remove(); document.documentElement.style.setProperty('--cw', CW + 'px'); }
function frame(box){
  const k = FR[box.dataset.frame || 'single'];
  let w = box.querySelector(':scope > .asc'); if (!w){ w = el('div', 'asc'); box.prepend(w); } w.innerHTML = '';
  const cols = Math.max(4, Math.floor(box.clientWidth / CW)), rows = Math.max(2, Math.floor(box.clientHeight / LH));
  const x0 = (box.clientWidth - cols * CW) / 2, xr = x0 + (cols - 1) * CW, yb = (rows - 1) * LH;
  const put = (t, x, y) => { const s = el('span', '', t); s.style.cssText = `position:absolute;left:${x}px;top:${y}px`; w.appendChild(s); };
  if (box.dataset.frame === 'corners'){ const n = Math.min(4, cols - 2); put(k[0] + k[1].repeat(n), x0, 0); put(k[1].repeat(n) + k[2], xr - n * CW, 0); put(k[4] + k[1].repeat(n), x0, yb); put(k[1].repeat(n) + k[5], xr - n * CW, yb); }
  else { put(k[0] + k[1].repeat(cols - 2) + k[2], x0, 0); put(k[4] + k[1].repeat(cols - 2) + k[5], x0, yb); const side = Array(Math.max(0, rows - 2)).fill(k[3]).join('\n'); put(side, x0, LH); put(side, xr, LH); }
  box.querySelector(':scope > .ttl')?.remove();
  if (box.dataset.title){ const t = el('span', 'ttl', box.dataset.title + ' '); if (box.dataset.sub) t.append(el('small', '', '· ' + box.dataset.sub)); box.prepend(t); }
}
const frameAll = () => document.querySelectorAll('.pane').forEach(frame);

/* ---------- typing helpers ---------- */
async function type(node, text, cps, my, opts = {}){
  for (const ch of text){
    if (!alive(my)) return false;
    if (ch === '⌫'){ await sleep(380); node.lastChild && node.lastChild.remove(); await sleep(240); continue; }
    if (ch === '|'){ await sleep(opts.pause || 500); continue; }
    node.appendChild(el('span', 'ch', ch));
    await sleep(opts.even ? 1000 / cps : /[，。？！…]/.test(ch) ? (opts.pause || 260) : 1000 / cps * (0.6 + Math.random() * 0.8));
  }
  return alive(my);
}
function row(parent, who, cls){ const r = el('div', 'row' + (cls ? ' ' + cls : '')); r.append(el('span', 'who', who)); const s = el('span', 'say'); r.append(s); parent.appendChild(r); return s; }
function chips(parent, list, onPick){
  const c = el('div', 'chips');
  list.forEach(o => { const b = el('button', 'chip'); b.type = 'button'; b.append(o.t); if (o.p) b.append(el('small', '', o.p)); if (o.off) b.disabled = true; b.addEventListener('click', () => onPick(o, b, c)); c.appendChild(b); });
  parent.appendChild(c); return c;
}

/* ================= shell ================= */
let cur = 0;
function renderIndex(){
  const list = $('#list'); list.innerHTML = ''; let day = '';
  V.forEach((x, i) => {
    if (x.day !== day){ day = x.day; list.appendChild(el('h3', '', day)); }
    const b = el('button', 'item'); b.type = 'button';
    b.append(el('span', 'n', String(i + 1).padStart(2, '0')), el('span', '', x.title), el('span', 'tier', `[${x.tier}]`));
    b.addEventListener('click', () => show(i)); list.appendChild(b);
  });
}
function renderSpec(x){
  const s = $('#spec'); s.querySelectorAll(':scope > :not(.asc):not(.ttl)').forEach(n => n.remove());
  const w = el('div');
  w.innerHTML = `<div class="scene">${x.ref}</div><h2>${x.title}</h2><div class="tierline">变化级别 <b>${x.tier}变</b></div>
    <h4>为什么这里不一样</h4><p>${x.why}</p><h4>规则</h4><ul>${x.rules.map(r => `<li>${r}</li>`).join('')}</ul>
    <div class="ref">详细设计：docs/design/chapters/01-assistant.md §5 · ${x.ref}</div>`;
  s.appendChild(w);
}
function show(i){
  cur = (i + V.length) % V.length; run++;
  timers.forEach(t => { clearTimeout(t); clearInterval(t); }); timers = [];
  const x = V[cur], v = $('#v');
  v.innerHTML = ''; v.className = 'v'; v.style.background = '';
  const sp = $('#stagePane'); sp.dataset.title = 'LINE'; sp.dataset.sub = x.ref; frame(sp);
  document.querySelectorAll('.item').forEach((b, j) => b.setAttribute('aria-current', String(j === cur)));
  document.querySelector('.item[aria-current="true"]')?.scrollIntoView({ block: 'nearest', inline: 'nearest' });
  $('#pos').textContent = `${String(cur + 1).padStart(2, '0')} / ${V.length}`;
  renderSpec(x); frame($('#spec'));
  x.play(v, run);
  try{ localStorage.setItem('ch1-gallery', x.id); }catch(e){}
}
$('#prev').addEventListener('click', () => show(cur - 1));
$('#next').addEventListener('click', () => show(cur + 1));
$('#replay').addEventListener('click', () => show(cur));
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input')) return;
  if (e.key === 'ArrowRight' || e.key === 'j') show(cur + 1);
  else if (e.key === 'ArrowLeft' || e.key === 'k') show(cur - 1);
  else if (e.key === 'r' || e.key === 'R') show(cur);
});
function layout(){ measure(); frameAll(); }
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(layout, 120); });
renderIndex(); layout();
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(layout);
let start = 0; try{ const id = localStorage.getItem('ch1-gallery'); const k = V.findIndex(x => x.id === id); if (k >= 0) start = k; }catch(e){}
show(start);
})();
</script>
