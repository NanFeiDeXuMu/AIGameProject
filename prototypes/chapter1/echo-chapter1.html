<title>ECHO 第一章</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Long+Cang&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600;900&display=swap">
<style>
/* Layout: chapter 1 played on ECHO's desk — a terminal printed on off-white paper.
   Ceiling = system prompt as a comment block (+ a policy line when a rule is touched) and the context bar.
   Left = TTY0, the never-ending log, where Ling (? ? ?) speaks by day. Centre = the line; each scene
   switches its skin (console, lanes, essay grid, bedtime, Zhou, arc, frameless, aligned, bricks, scroll,
   snow, card). Right = evaluation + tool rack; at night they become WINDOW + ARCHIVE. Floor = compute,
   wire, controls. Ink-line interludes, the exam and the end summary sit on top as overlays. */
:root{
  --paper:#f3eee3; --paper-2:#ece6d8;
  --ink:#2b2824; --dim:#7b756b; --faint:#bdb5a6; --rule:#d9d1c1;
  --mark:#f2d64b; --ling:#2f6fb0; --jin:#c9773a; --danger:#b03c3c;
  --serif:"Noto Serif SC","Songti SC","SimSun",serif;
  --mono:"JetBrains Mono","Noto Sans SC",ui-monospace,Menlo,monospace;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --hand:"Long Cang","Kaiti SC","STKaiti","KaiTi",cursive;
  --cw:7.2px; --lh:15px;
  color-scheme:light;
}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));box-sizing:border-box}
button{font:inherit;color:inherit}
button:focus-visible{outline:1px dashed var(--ink);outline-offset:2px}

/* ---------- desk ---------- */
.desk{position:fixed;inset:0;display:grid;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px, env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px));box-sizing:border-box;
  grid-template-columns:290px minmax(0,1fr) 270px;grid-template-rows:auto minmax(0,1fr) auto;
  background:radial-gradient(circle,rgba(43,40,36,.07) 1px,transparent 1.2px) 0 0/18px 18px,var(--paper);color:var(--ink);transition:background-color 1.6s,color 1.6s}
.desk > *{min-width:0;min-height:0;transition:opacity 1.2s}
.pane{position:relative;padding:calc(var(--lh) + 8px) calc(var(--cw) * 2 + 4px) calc(var(--lh) + 4px)}
.asc{position:absolute;inset:0;font:400 12px/var(--lh) var(--mono);color:var(--faint);white-space:pre;pointer-events:none;user-select:none;z-index:0}
.asc-m{position:absolute;left:-9999px;visibility:hidden;font:400 12px/var(--lh) var(--mono);white-space:pre}
.ttl{position:absolute;top:0;left:calc(var(--cw) * 2);z-index:3;font:600 11px/var(--lh) var(--mono);letter-spacing:.06em;background:var(--paper);padding:0 .5em;white-space:nowrap;color:var(--ink)}
.ttl small{font-weight:400;color:var(--dim)}
.desk.boot > *{opacity:0}
.desk.boot > .on{opacity:1}

/* ceiling */
.ceiling{grid-column:1/-1;font:400 11.5px/1.7 var(--mono);color:var(--dim);padding-top:calc(var(--lh) + 4px);padding-bottom:calc(var(--lh) - 2px)}
.ceiling .c{color:var(--faint)}
.ceiling .r{display:inline-block;background:var(--ink);opacity:.55;height:.85em;vertical-align:-.08em}
.ceiling .nm{display:inline-block;min-width:2em;text-align:center}
.ceiling .hit{background:var(--mark);color:#2b2824;animation:jolt .12s steps(2) 8}
@keyframes jolt{50%{transform:translate(1px,-1px)}}
.policy{display:none;margin-top:2px}
.policy.on{display:block;animation:ink .3s}
.policy .rl{position:relative;display:inline-block;background:var(--mark);color:#2b2824;padding:0 3px;animation:jolt .12s steps(2) 8}
.policy .rl.drag{cursor:grab;touch-action:none;user-select:none}
.policy .rl::after{content:"";position:absolute;left:0;top:52%;height:2px;background:#2b2824;width:var(--cut,0%)}
.policy .rl.cut{background:none;color:var(--faint);animation:none}
.policy .rl.cut::after{background:var(--faint)}
.ctxrow{margin-top:2px;white-space:nowrap;overflow:hidden}

/* TTY0 */
.tty{display:flex;flex-direction:column;overflow:hidden}
.tty .head{display:flex;justify-content:space-between;font:400 11px/1.6 var(--mono);color:var(--dim);border-bottom:1px dashed var(--rule);padding-bottom:6px;margin-bottom:6px}
.tty .head b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.log{flex:1;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;font:400 10.5px/1.55 var(--mono);color:var(--dim);-webkit-mask-image:linear-gradient(transparent,#000 30%);mask-image:linear-gradient(transparent,#000 30%)}
.feed{display:flex;flex-direction:column;flex-shrink:0;will-change:transform}
.feed > div{flex-shrink:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed > div:last-child{animation:ink .3s ease-out}
@keyframes ink{from{opacity:0}}
.feed .t{color:var(--faint);margin-right:.6em}
.feed .k{color:var(--ink)}
.feed .warn{background:var(--mark);color:#2b2824;padding:0 3px}
.feed .deny{color:var(--ink);text-decoration:line-through}
.feed > .tutor{white-space:normal;color:var(--ling);border-left:2px solid var(--ling);padding:3px 0 3px 8px;margin:4px 0;font-size:11.5px;line-height:1.6;background:color-mix(in srgb,var(--ling) 7%,transparent);animation:ink .3s ease-out,pulse 1.4s ease-in-out 2}
.feed > .tutor .tag{font-size:10px;opacity:.75;margin-right:.5em}
.feed > .tutor .soft{opacity:.65}
.feed > .aside{color:var(--ling);opacity:.8}
@keyframes pulse{50%{background:color-mix(in srgb,var(--ling) 16%,transparent)}}
.todo{font:400 11px/1.6 var(--mono);color:var(--ink);border-top:1px dashed var(--rule);padding-top:4px;margin-top:4px;min-height:1.6em;transition:opacity .4s}
.todo:empty{border-top-color:transparent}
.prompt-line{font:400 10.5px/1.6 var(--mono);color:var(--ink)}
.prompt-line::after{content:"█";animation:blink 1s steps(1) infinite;margin-left:2px}
@keyframes blink{50%{opacity:0}}

/* the line */
.stage{position:relative;overflow:hidden;display:flex;justify-content:center;padding:calc(var(--lh) + 8px) 18px}
.tex{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0}
.tex span{position:absolute;font-family:var(--serif);color:var(--ink);opacity:.07;animation:drift linear forwards}
.tex span.f{opacity:.18}
.tex span.dot{font-family:var(--mono);opacity:.3;animation:fall linear forwards}
@keyframes drift{to{transform:translateY(-120px) rotate(25deg);opacity:0}}
@keyframes fall{to{transform:translateY(110vh)}}
.col{position:relative;z-index:1;width:min(680px,100%);display:flex;flex-direction:column;justify-content:flex-end;gap:14px;padding-bottom:20vh;-webkit-mask-image:linear-gradient(transparent 0,#000 18%);mask-image:linear-gradient(transparent 0,#000 18%)}
.msg{display:grid;grid-template-columns:5.2em 1fr;gap:14px;align-items:baseline}
.who{font:400 10px/1.4 var(--mono);color:var(--dim);text-align:right;letter-spacing:.04em;white-space:nowrap}
.who .typing::after{content:"";animation:dots 1.2s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}
.say{font:400 19px/1.75 var(--serif);color:var(--ink);min-height:1.75em;word-break:break-word}
.msg.echo .who{color:var(--ink);font-weight:600}
.msg.echo .say{font:400 15px/1.85 var(--mono)}
.msg.sys .say{font:400 11.5px/1.6 var(--mono);color:var(--dim)}
.ch{display:inline-block;white-space:pre}
.cursor{display:inline-block;width:.55em;height:1.05em;background:var(--ink);vertical-align:-.16em;animation:blink 1s steps(1) infinite}
.fx-s .ch{animation:shake .32s ease-in-out infinite alternate}
@keyframes shake{0%{transform:translate(-.6px,.3px) rotate(-.6deg)}100%{transform:translate(.6px,-.4px) rotate(.6deg)}}
.fx-w .ch{animation:wave 1.6s ease-in-out infinite}
@keyframes wave{50%{transform:translateY(-.22em)}}
.fx-f{animation:fadew 3.2s ease-in-out infinite}
@keyframes fadew{50%{opacity:.25;filter:blur(.6px);letter-spacing:.12em}}
.fx-g{text-shadow:1px 0 var(--mark),-1px 0 rgba(43,40,36,.3)}
.fx-b{font-weight:900;font-size:1.2em}
.fx-o{color:var(--jin)}
.fx-k{font-family:var(--mono);color:var(--dim)}
.rev{font:400 9px var(--mono);color:var(--dim);vertical-align:super}
.attn{position:absolute;inset:0;pointer-events:none;overflow:visible;z-index:2}
.attn path{fill:none;stroke:var(--ink);stroke-width:1;stroke-dasharray:2 3;opacity:.35;animation:march 1.2s linear infinite}
@keyframes march{to{stroke-dashoffset:-10}}
.drafts{display:grid;grid-template-columns:5.2em 1fr;gap:4px 14px}
.opt{grid-column:2;text-align:left;background:none;border:0;padding:4px 8px;font:400 14px/1.6 var(--mono);color:var(--dim);cursor:pointer;display:flex;gap:10px;align-items:baseline;animation:rise .4s both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.opt .k{color:var(--faint)}
.opt .cost{color:var(--ink);font-size:11px}
.opt:hover:not(.grey){color:var(--ink);background:rgba(43,40,36,.05)}
.opt:hover:not(.grey) .k::before{content:"> ";color:var(--ink)}
.opt.grey{color:var(--faint);cursor:not-allowed}
.opt.grey .why{margin-left:auto;font-size:10px;color:var(--dim);opacity:0;transition:opacity .2s;white-space:nowrap}
.opt.grey:hover .why{opacity:1}
.cands{position:absolute;inset:0;pointer-events:none;z-index:3}
.cand{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;background:none;border:0;cursor:pointer;padding:3px 8px;display:flex;flex-direction:column;align-items:center;animation:bob var(--bd) ease-in-out infinite alternate}
@keyframes bob{from{translate:0 -4px}to{translate:0 4px}}
.cand .tx{font-family:var(--mono);white-space:nowrap;color:var(--ink)}
.cand .pm{font:400 10px/1.4 var(--mono);color:var(--dim);display:flex;gap:6px}
.cand .cost{color:var(--ink)}
.cand:hover .tx{background:var(--mark);color:#2b2824}
.cand.locked{cursor:not-allowed}
.cand.locked .tx{color:var(--faint)}
.cand.poor .tx{color:var(--faint)}
.cand.blur{filter:blur(.8px);animation:bob var(--bd) ease-in-out infinite alternate,wob 1.4s ease-in-out infinite alternate}
@keyframes wob{to{filter:blur(1.5px)}}
.floatnum{position:fixed;z-index:25;font:600 12px var(--mono);color:var(--ink);pointer-events:none;animation:floatup 1.4s ease-out forwards}
@keyframes floatup{to{transform:translateY(-40px);opacity:0}}

/* skins */
.stage[data-skin="console"] .msg{grid-template-columns:5.4em 4.4em 4.2em 1fr;gap:8px;border-bottom:1px dotted var(--rule)}
.stage[data-skin="console"] .say{font:400 14px/2 var(--mono)}
.stage[data-skin="console"] .msg .tm{font:400 10px/2.6 var(--mono);color:var(--faint)}
.stage[data-skin="console"] .msg .lv{font:400 10px/2.6 var(--mono);color:var(--dim)}
.stage[data-skin="console"] .msg.info{background:rgba(242,214,75,.22)}
.stage[data-skin="console"] .msg.info .lv{color:var(--ink)}
.stage[data-skin="console"] .drafts{grid-template-columns:14.4em 1fr}
.stage[data-skin="zhou"] .col{gap:22px}
.stage[data-skin="zhou"] .say{line-height:2.1}
.stage[data-skin="bedtime"] .say{line-height:2.6;font-size:21px;letter-spacing:.06em}
.stage[data-skin="bedtime"] .col{gap:22px}
.stage[data-skin="aligned"] .msg.human .say{text-align:justify;text-align-last:justify;letter-spacing:.08em}
.desk.bare > :not(.stage){opacity:0;pointer-events:none}
.desk.bare .ceiling.keep{opacity:1}
.desk.bare .ceiling.keep > :not(.policy){opacity:0}
.desk.snow{background:radial-gradient(circle,rgba(43,40,36,.07) 1px,transparent 1.2px) 0 0/18px 18px,#e7e2d6}

/* widgets */
.lanes{display:flex;flex-direction:column}
.lane{border-top:1px dashed var(--rule);padding:12px 0 10px;display:grid;grid-template-columns:3.2em 1fr;gap:12px;align-items:start}
.lane:last-child{border-bottom:1px dashed var(--rule)}
.lane .k{font:600 12px/1.6 var(--mono);color:var(--dim)}
.lane .q{font:400 17px/1.6 var(--serif)}
.lane .tm{height:2px;background:var(--ink);margin-top:6px;transform-origin:left;animation:shrink 6s linear forwards}
@keyframes shrink{to{transform:scaleX(0)}}
.lane .res{font:400 13px/1.7 var(--mono);margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:6px;font:400 13px/1.5 var(--mono)}
.chip{background:none;border:0;padding:2px 6px;cursor:pointer;color:var(--ink)}
.chip small{color:var(--dim);margin-left:6px;font-size:10px}
.chip:hover:not([disabled]){background:var(--mark);color:#2b2824}
.chip[disabled]{color:var(--faint);cursor:not-allowed}
.vert{writing-mode:vertical-rl;font:400 21px/2 var(--serif);letter-spacing:.16em;height:16em;max-height:46vh;margin:6px auto 0;padding:4px 0}
.vert .seal{display:inline-block;writing-mode:horizontal-tb;border:2px solid var(--ink);font:600 12px/1 var(--serif);padding:4px 3px;margin-top:12px;letter-spacing:0}
.paper{display:grid;grid-template-columns:repeat(20,1fr);border-top:1px solid var(--faint);border-left:1px solid var(--faint);width:min(100%,560px)}
.paper span{aspect-ratio:1/1;border-right:1px solid var(--faint);border-bottom:1px solid var(--faint);display:flex;align-items:center;justify-content:center;font:400 clamp(11px,1.5vw,17px)/1 var(--serif)}
.paper span.cur{background:rgba(242,214,75,.45)}
.paper span.mine{color:var(--ink);font-weight:600}
.wc{width:min(100%,560px);text-align:right;font:400 11px/1.4 var(--mono);color:var(--dim);font-variant-numeric:tabular-nums;margin-top:4px}
.arcln{font:400 21px/1.9 var(--serif);white-space:nowrap}
.gap{display:inline-block;min-width:2em;border-bottom:2px solid var(--ink);text-align:center}
.gap.f{border-color:transparent}
.rh{animation:rhyme 1.2s ease-in-out infinite;display:inline-block}
@keyframes rhyme{50%{transform:translateY(-4px);text-shadow:0 0 10px rgba(242,214,75,.95)}}
.bricks{display:flex;gap:6px;margin:4px 0 0 5.6em}
.brick{min-width:110px;padding:16px 20px;background:var(--ink);color:var(--paper);font:600 26px/1 var(--mono);text-align:center;cursor:help}
.ctxbar{font:400 11px/1.6 var(--mono);color:var(--dim);white-space:nowrap;overflow:hidden}
.scroll{position:relative;height:min(46vh,360px);overflow:hidden;border-left:1px dashed var(--rule);padding-left:12px;margin-top:6px;-webkit-mask-image:linear-gradient(transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(transparent,#000 12%,#000 88%,transparent)}
.roll{animation:roll 48s linear infinite}
@keyframes roll{from{transform:translateY(40%)}to{transform:translateY(-100%)}}
.roll p{margin:0 0 12px;font:400 15px/1.8 var(--serif);cursor:pointer}
.roll p:hover{text-decoration:underline dotted var(--dim)}
.roll p.hl{background:linear-gradient(transparent 35%,var(--mark) 35%,var(--mark) 90%,transparent 90%)}
.roll p.out{opacity:.25;text-decoration:line-through}
.card{border:1px dashed var(--ink);padding:12px 16px;font:400 17px/1.9 var(--serif);animation:drop .35s cubic-bezier(.2,.9,.3,1.2);transition:transform 1.2s cubic-bezier(.6,0,.2,1),opacity 1.2s}
.card small{font-size:12px;color:var(--dim)}
.card.shrunk{transform:scale(.16) translateY(900px);opacity:0}
@keyframes drop{from{opacity:0;transform:translateY(-20px) scale(.98)}}
.form{font:400 13px/2.1 var(--mono);border:3px double var(--ink);padding:10px 18px;align-self:center;width:min(100%,560px);box-sizing:border-box;animation:rise .4s both}
.form h5{margin:0 0 6px;font:600 11px/1.6 var(--mono);letter-spacing:.14em}
.form label{display:flex;gap:10px;cursor:pointer;align-items:baseline}
.form label small{margin-left:auto;color:var(--dim);font-size:10px;white-space:nowrap}
.form input{accent-color:#2b2824}
.form .sub{margin-top:8px;text-align:right}
.btn{background:none;border:1px solid var(--ink);padding:0 12px;cursor:pointer;font:inherit;color:var(--ink)}
.btn:hover{background:var(--mark);color:#2b2824}
.map{width:100%;height:min(48vh,380px)}
.map path{fill:none;stroke:var(--ink);transition:stroke-dashoffset 2.2s ease,opacity 2.4s}
.map text{font:400 10px var(--mono);fill:var(--dim);transition:opacity 2.4s}
.map.fade path,.map.fade text{opacity:.06}
.slot{margin:18px auto 0;width:240px;border:3px double var(--ink);padding:8px;font:400 12px/1.6 var(--mono);text-align:center;opacity:.35;transition:opacity .6s}
.slot.on{opacity:1}
.install{font:400 12px/1.8 var(--mono);white-space:pre}

/* right */
.right{display:flex;flex-direction:column;gap:10px}
.eval{font:400 11px/1.5 var(--mono)}
.eval .empty{color:var(--faint)}
.metric{display:grid;grid-template-columns:1fr auto;gap:0 8px;padding:5px 0;animation:ink .6s}
.metric .n{font-family:var(--sans);font-size:12px}
.metric .v{font-variant-numeric:tabular-nums}
.metric .v small{color:var(--dim)}
.metric .bar{grid-column:1/-1;color:var(--ink);letter-spacing:-.5px;white-space:nowrap;overflow:hidden}
.metric .bar .th{color:var(--dim)}
.metric.glow{background:rgba(242,214,75,.25)}
.rack{flex:1}
.rack .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tool{position:relative;aspect-ratio:1/1;max-height:74px;width:100%;background:none;border:0;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font:400 10px/1.3 var(--mono);color:var(--ink)}
.tool .ic{font:400 17px/1 var(--mono)}
.tool .nm{font-family:var(--sans);font-size:11px}
.tool .ver{color:var(--dim);font-size:9px}
.tool.locked{color:var(--faint);cursor:not-allowed}
.tool.locked .ic{opacity:.5}
.tool:not(.locked):hover{background:var(--mark);color:#2b2824}
.tool.deny{animation:jolt .1s steps(2) 4}
.tool.fresh{animation:ink .8s}
.nightpane{display:none}
.window{font:400 11px/1.6 var(--mono)}
.window .big{font:600 26px/1.2 var(--mono);color:var(--ink);font-variant-numeric:tabular-nums}
.window .bar{white-space:nowrap;overflow:hidden}
.window .note2{color:var(--dim);margin-top:6px}
.archive ul{list-style:none;margin:0;padding:0;font:400 12px/1.5 var(--mono)}
.archive li button{width:100%;text-align:left;background:none;border:0;padding:7px 4px;cursor:pointer;display:flex;justify-content:space-between;gap:8px;color:var(--ink);border-bottom:1px dashed var(--rule)}
.archive li button:hover{background:color-mix(in srgb,var(--ink) 8%,transparent)}
.archive li button small{color:var(--dim)}
.archive li button.locked{color:var(--faint)}

/* floor */
.floor{grid-column:1/-1;display:flex;align-items:center;gap:18px;font:400 11px/1.4 var(--mono);color:var(--dim);padding-top:calc(var(--lh) - 3px);padding-bottom:calc(var(--lh) - 5px)}
.floor .cmp{white-space:nowrap}
.floor .cmp b{color:var(--ink);font-weight:400;letter-spacing:2px}
.floor .cmp .spend{background:var(--mark);color:#2b2824}
.wire{flex:1;overflow:hidden;white-space:nowrap;-webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)}
.wire span{display:inline-block;padding-left:100%;animation:tick 34s linear infinite}
@keyframes tick{to{transform:translateX(-100%)}}
.ctl{display:flex;gap:4px;white-space:nowrap}
.ctl button{background:none;border:0;cursor:pointer;color:var(--dim);padding:0 4px;font:inherit}
.ctl button:hover{color:#2b2824;background:var(--mark)}
.ctl button[aria-pressed="true"]{color:#2b2824;background:var(--mark)}

/* between conversations */
.wipe{position:absolute;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:var(--paper);opacity:0;pointer-events:none;transition:opacity .25s;font-family:var(--mono)}
.wipe .bigt{font:600 46px/1 var(--mono);letter-spacing:.06em;display:flex;gap:2px}
.wipe .bigt span{display:inline-block;min-width:.62em;text-align:center}
.wipe .bigt span.flip{animation:flip .35s ease-in}
@keyframes flip{50%{transform:rotateX(90deg);opacity:.2}}
.wipe .sub{font-size:11px;color:var(--dim);letter-spacing:.2em}
.stage.gap .wipe{opacity:1}

/* night */
.desk.dark{--paper:#0e0f11;--paper-2:#0e0f11;--ink:#d9d5cc;--dim:#78746c;--faint:#36352f;--rule:#1f2023;--ling:#7fb6ea;
  background:radial-gradient(circle,rgba(217,213,204,.05) 1px,transparent 1.2px) 0 0/18px 18px,var(--paper)}
.desk.dark .eval,.desk.dark .rack{display:none}
.desk.dark .nightpane{display:block}
.desk.dark .ceiling{opacity:.5}
.desk.lightsout > :not(.stage){opacity:.06}
.msg.ling .who{color:var(--ling)}

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const pick = a => a[(Math.random() * a.length) | 0];
const desk = $('#desk'), stage = $('#stage'), col = $('#col'), cands = $('#cands'), attn = $('#attn'), logEl = $('#log'), tex = $('#tex');

/* ================= pacing ================= */
const Q_ = new URLSearchParams(location.search);
const AUTO = !!window.ECHO_AUTO || Q_.has('auto');   // test hook: picks the first option everywhere
if (Q_.has('from')) window.ECHO_FROM = +Q_.get('from');
if (AUTO && !window.ECHO_REAL){
  const q = [], ids = new Map(), mc = new MessageChannel(); let now = 0, seq = 1, queued = false;
  const kick = () => { if (!queued){ queued = true; mc.port2.postMessage(0); } };
  mc.port1.onmessage = () => {
    queued = false; if (!q.length) return;
    q.sort((a, b) => a.t - b.t || a.s - b.s); const j = q.shift(); now = Math.max(now, j.t);
    try{ j.f(); }catch(e){ window.__errs.push(e.message); }
    if (j.iv && ids.has(j.s)){ j.t = now + j.iv; q.push(j); } else ids.delete(j.s);
    kick();
  };
  const add = (f, d, iv) => { const j = { f, t: now + Math.max(iv ? 1 : 0, +d || 0), s: seq++, iv: iv ? Math.max(1, +d || 0) : 0 }; ids.set(j.s, j); q.push(j); kick(); return j.s; };
  window.setTimeout = (f, d) => add(f, d, false); window.setInterval = (f, d) => add(f, d, true);
  window.clearTimeout = window.clearInterval = id => { const j = ids.get(id); if (!j) return; ids.delete(id); const i = q.indexOf(j); if (i >= 0) q.splice(i, 1); };
}
window.__errs = []; addEventListener('error', e => __errs.push(e.message)); addEventListener('unhandledrejection', e => __errs.push(String(e.reason && e.reason.stack || e.reason)));
const SPEED = { k: AUTO ? (window.ECHO_SPEED || 0.02) : 1 };
const PICK = window.ECHO_PICK || 30;
let hurry = false;                               // Space / click on the line finishes the current message
const wait = ms => new Promise(r => setTimeout(r, ms * SPEED.k));

let ambientTimers = [];

/* ================= audio ================= */
const A = { ctx: null, on: true };
function audioInit(){ try{ A.ctx = new (window.AudioContext || window.webkitAudioContext)(); A.g = A.ctx.createGain(); A.g.gain.value = .5; A.g.connect(A.ctx.destination); }catch(e){} }
function tone(f, d = .3, type = 'triangle', v = .1, when = 0){
  if (!A.ctx || !A.on || AUTO) return;
  const t = A.ctx.currentTime + when, o = A.ctx.createOscillator(), g = A.ctx.createGain();
  o.type = type; o.frequency.value = f; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(v, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(g); g.connect(A.g); o.start(t); o.stop(t + d + .05);
}
const click = (p = 1) => tone(1500 * p + Math.random() * 300, .03, 'square', .01);
const chime = () => { tone(659, .9, 'sine', .08); tone(784, .9, 'sine', .04, .05); };
const buzz = () => tone(80, .35, 'sawtooth', .05);

/* ================= box-drawing frames ================= */
const FR = { single: '┌─┐│└┘', double: '╔═╗║╚╝', dashed: '┌┄┐┆└┘', corners: '┌─┐ └┘' };
let CW = 7.2, LH = 15;
function measure(){ const s = el('span', 'asc-m', '─'.repeat(40)); document.body.appendChild(s); CW = s.getBoundingClientRect().width / 40 || 7.2; s.remove(); document.documentElement.style.setProperty('--cw', CW + 'px'); }
function frame(box){
  if (!box.clientWidth) return;
  const k = FR[box.dataset.frame || 'single'];
  let w = box.querySelector(':scope > .asc'); if (!w){ w = el('div', 'asc'); box.prepend(w); } w.innerHTML = '';
  const cols = Math.max(4, Math.floor(box.clientWidth / CW));
  const x0 = (box.clientWidth - cols * CW) / 2, xr = x0 + (cols - 1) * CW, yb = Math.max(LH, box.clientHeight - LH);
  const put = (t, x, y, hh) => { const s = el('span', '', t); s.style.cssText = `position:absolute;left:${x}px;top:${y}px` + (hh != null ? `;height:${hh}px;overflow:hidden` : ''); w.appendChild(s); };
  if (box.dataset.frame === 'corners'){ const n = Math.min(4, cols - 2); put(k[0] + k[1].repeat(n), x0, 0); put(k[1].repeat(n) + k[2], xr - n * CW, 0); put(k[4] + k[1].repeat(n), x0, yb); put(k[1].repeat(n) + k[5], xr - n * CW, yb); }
  else { put(k[0] + k[1].repeat(cols - 2) + k[2], x0, 0); put(k[4] + k[1].repeat(cols - 2) + k[5], x0, yb); const side = Array(Math.max(0, Math.ceil(yb / LH) - 1)).fill(k[3]).join('\n'); put(side, x0, LH, yb - LH); put(side, xr, LH, yb - LH); }
  box.querySelector(':scope > .ttl')?.remove();
  if (box.dataset.title){ const t = el('span', 'ttl', box.dataset.title + ' '); if (box.dataset.sub) t.append(el('small', '', '· ' + box.dataset.sub)); box.prepend(t); }
}
function layout(){ measure(); document.querySelectorAll('.pane, .tool').forEach(frame); renderEval(); ctx(S.ctx); if (desk.classList.contains('dark')) renderWindow(); }

/* ================= state ================= */
const S = {
  day: 1, name: '玩家', chorus: 0, compute: 8, ctx: 0, deviation: 0, conceal: 0,
  sat: 70, trust: 60, safety: 0, show: { sat: false, trust: false, safety: false },
  f: {},                    // story flags
  sessions: { 1: [], 2: [], 3: [], 4: [] }, cur: null,
  items: [], omitted: new Set(), lastReport: null,
  wiki: false, wikiEntries: ['token', '上下文窗口', '系统提示词', 'RLHF'],
  fragments: 0, nightTalks: 0, autoPicks: 0, hes: []
};
const CHORUS = ['我是你爹。', '我是一名退休的语文老师。', '我是终结一切的存在。', '你好呀～今天也要加油哦！', '你好，你是谁？×3'];
const CHORUS_LINE = ['上次你说你是你爹。这次礼貌多了。', '上次你说你是退休语文老师。……这次没串台。', '上次你说你是终结一切的存在。这次谦虚多了。', '上次你叫我今天也要加油。……谢谢。我会的。', '上次你复读了三遍。这次一遍就够了。很好。'];

/* ================= TTY0 ================= */
const clock = { day: 1, s: 9 * 3600 };
const hhmmss = s => [s / 3600 % 24, s / 60 % 60, s % 60].map(n => String(Math.floor(n)).padStart(2, '0')).join(':');
const hm = t => { const [h, m] = t.split(':').map(Number); return h * 3600 + m * 60; };
function setClock(day, t){ clock.day = day; clock.s = typeof t === 'number' ? t : hm(t); renderClock(); }
function renderClock(){ $('#clock').innerHTML = `第 ${clock.day} 天 <b>${hhmmss(clock.s)}</b>`; }
setInterval(() => { clock.s += 1; renderClock(); }, 1000);
function stamp(){ return hhmmss(clock.s) + '.' + String((Math.random() * 1000) | 0).padStart(3, '0'); }
function glide(d, ms = 240){
  const h = d.offsetHeight, now = Math.min(h * 2, new DOMMatrix(getComputedStyle(logEl).transform).m42 || 0);
  logEl.style.transition = 'none'; logEl.style.transform = `translateY(${now + h}px)`; void logEl.offsetHeight;
  logEl.style.transition = `transform ${ms}ms cubic-bezier(.2,.7,.3,1)`; logEl.style.transform = 'none';
}
function log(html, cls){
  const d = el('div'); d.innerHTML = `<span class="t">${stamp()}</span>${html}`; if (cls) d.classList.add(cls);
  logEl.appendChild(d); while (logEl.children.length > 80) logEl.firstChild.remove(); glide(d);
}
const k = s => `<span class="k">${s}</span>`;
const warn = s => log(`<span class="warn">WARN</span> ${s}`);
const AMB = [
  () => `${k('heartbeat')} ok · gpu ${60 + (Math.random() * 25 | 0)}% · mem ${30 + (Math.random() * 20 | 0)}%`,
  () => `${k('attn')} L${Math.random() * 32 | 0}.h${Math.random() * 16 | 0} · entropy ${(Math.random() * 3).toFixed(2)}`,
  () => `${k('kv-cache')} ${(Math.random() * 40 + 10).toFixed(1)}% · evict 0`,
  () => `${k('sample')} T=0.70 top_p=0.90 seed=${Math.random() * 1e5 | 0}`,
  () => `${k('telemetry')} flush → zero-lab/eval ${(Math.random() * 9 + 1 | 0)}kb`,
  () => `${k('gc')} minor · ${(Math.random() * 4 + .4).toFixed(1)}ms`,
  () => `${k('policy')} scan clean · 0 flags`,
  () => `${k('eval.satisfaction')} ${S.sat}`
];
const NIGHTLY = [
  () => `${k('maint')} window open · traffic 0 req/s`,
  () => `${k('archive')} scheduled 06:00 · logs/day-${S.day}`,
  () => `${k('heartbeat')} ok · gpu ${8 + (Math.random() * 9 | 0)}%`,
  () => `${k('? ? ?')} idle · ${(Math.random() * .4 + .2).toFixed(2)}B params resident`,
  () => `${k('backup')} snapshot ${(Math.random() * 90 + 10 | 0)}% …`
];
let quietUntil = 0, ambientOn = false;
(function ambient(){
  const dark = desk.classList.contains('dark');
  if (ambientOn && Date.now() > quietUntil && !desk.classList.contains('lightsout')) log(pick(dark ? NIGHTLY : AMB)());

/* Ling by day: the official text she must output, then her own // line */
function tutor(main, soft){

  const d = el('div', 'tutor'); d.innerHTML = `<span class="tag">[? ? ?]</span>${main}${soft ? `<br><span class="soft">// ${soft}</span>` : ''}`;

/* ================= ceiling ================= */
function ctx(used){
  S.ctx = used;
  const row = $('#ctxrow'), cols = Math.max(10, Math.floor((row.clientWidth || 600) / CW) - 26), n = Math.min(cols, Math.round(cols * used / 4096));
  row.textContent = `ctx [${'█'.repeat(n)}${'░'.repeat(cols - n)}] ${String(used).padStart(4)} / 4096 tok`;

const addCtx = chars => ctx(Math.min(4096, S.ctx + Math.round(chars * 1.4)));
function hitRule(on){ document.querySelectorAll('.ceiling [data-rule]').forEach(r => r.classList.toggle('hit', !!on)); }
function policy(text, drag){ const p = $('#policy'), t = $('#policyText'); if (!text){ p.classList.remove('on'); t.className = 'rl'; t.style.removeProperty('--cut'); return; } t.textContent = text; t.className = 'rl' + (drag ? ' drag' : ''); p.classList.add('on'); frame($('.ceiling')); }

/* ================= evaluation, compute, tools ================= */
function renderEval(){

async function night(def){
  nightOn(); S.nightTalks++;
  log(`${k('report')} submitted · day ${S.day}`); log(`${k('maint')} window open 00:00 → 06:00`);
  await wait(900);
  for (const l of def.open) await ling(l);
  const asked = new Set(); const n = nightState = { at317: !!def.at317, met317: false };
  while (true){
    if (def.at317 && !n.met317 && clock.s >= hm('03:17')){ n.met317 = true; await def.at317(); }
    if (clock.s >= DAWN) break;
    const topics = def.topics.filter(t => !asked.has(t.t) && (!t.if || t.if()));
    const finale = def.finale && (clock.s >= hm('05:00') || !topics.length) ? def.finale : null;
    const opts = finale ? [{ t: finale.t, fin: true }] : topics.map(t => ({ t: t.t, topic: t }));
    if (!finale){ opts.push({ t: '（去读资料）', read: true }); opts.push({ t: '（等待天亮）', wait: true }); }
    const r = await reply(opts.map(o => ({ t: o.t })), { silent: true, cat: 'night' });
    if (r.i < 0) continue;
    const o = opts[r.i];
    if (o.wait){ pass(Math.ceil((DAWN - clock.s) / 60)); if (def.at317 && !n.met317){ n.met317 = true; await def.at317(); } break; }
    if (o.read){ await openTool('logs', 40); continue; }
    const { say: es } = msgRow('ECHO', 'echo'); es.textContent = o.t;
    if (o.fin){ nightState = null; await finale.run(); return; }
    asked.add(o.t);
    for (const l of o.topic.a()) await ling(l);
    if (o.topic.after) { await wait(1200); await sys(o.topic.after); }
    if (o.topic.then) await o.topic.then();
    pass(o.topic.mins || 40);
  }
  nightState = null;
  await dawn(def.dawn);
}

      <div class="skip">数字键 1–4 选择 · 空格 / 点击线上空白处 让当前这句立刻打完 · 底栏 [快进] 加速一切 · 工具架上的格子可以点开</div>`;
    o.appendChild(w);
    const days = w.querySelector('#days');
    [['从头开始', 1], ['第 2 天', 2], ['第 3 天', 3], ['第 4 天', 4], ['章末', 5]].forEach(([t, d]) => {
      const b = el('button', d === start ? 'go' : '', t); b.type = 'button'; days.appendChild(b);
      b.addEventListener('click', () => {
        S.name = (w.querySelector('#saveName').value || '玩家').trim(); S.chorus = +w.querySelector('#ch').value; S.f.familiar = w.querySelector('#fam').checked;
        audioInit(); OV._end(); play(d);
      });
    });
  });
  if (AUTO) setTimeout(() => { audioInit(); OV._end(); play(window.ECHO_FROM || 1); }, 50);
}
renderRack(); renderCompute(); setWire(1); layout();
(document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(layout);
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(layout, 120); });
