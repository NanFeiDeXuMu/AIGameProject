<title>ECHO 序章</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Long+Cang&family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;700;900&family=Noto+Serif+SC:wght@400;600;900&family=Press+Start+2P&family=ZCOOL+KuaiLe&family=ZCOOL+QingKe+HuangYou&family=Zhi+Mang+Xing&display=swap">
<style>
/* Layout: full-screen stage. Canvas behind = data flood + the light point (upper fifth).
   Foreground text floats free in the middle of the screen — no panels, no boxes.
   Choices burst out of the blank in a sentence and drift around it.
   Everything advances on its own; Space / clicking empty space only hurries a beat.
   Foreground stays black / white / grey per the art bible; the background flood is the
   one place where the full colour of human writing is allowed. */
:root{
  --bg:#0a0b0d;
  --ink:#e9e7e2;
  --dim:#8d9096;
  --faint:#3c3f45;
  --line:#25282d;
  --ling:#aab2ba;
  --blue:#6fb0ea;
  --red:#ff4d55;
  --blood:#2a0b0e;
  --blood-ink:#d0636a;
  --mono:"JetBrains Mono","Noto Sans SC",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --serif:"Noto Serif SC","Songti SC","SimSun",serif;
  --hand:"Long Cang","Kaiti SC","STKaiti","KaiTi",cursive;
  --fo:clamp(20px,3.4vw,30px);
  color-scheme:dark;
}
html,body{height:100%;margin:0}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sans);
  overflow:hidden;-webkit-font-smoothing:antialiased;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
button{font:inherit;color:inherit}
button:focus-visible{outline:1px solid var(--ink);outline-offset:3px}

#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
body.blood{background:var(--blood);transition:background 1.2s}
body:not(.blood){transition:background 1.2s}

/* ---------- HUD ---------- */
.hud{position:fixed;z-index:5;font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--dim);pointer-events:none;font-variant-numeric:tabular-nums;text-shadow:0 0 6px #000,0 0 2px #000}
#hudTL{top:calc(12px + env(safe-area-inset-top,0px));left:max(16px, env(safe-area-inset-left,0px));max-width:70vw}
#hudTR{top:calc(12px + env(safe-area-inset-top,0px));right:max(16px, env(safe-area-inset-right,0px));text-align:right;line-height:1.7}
#hudTR b{color:var(--ink);font-weight:400}
#hudBR{bottom:calc(76px + env(safe-area-inset-bottom,0px));right:max(16px, env(safe-area-inset-right,0px))}
#loss{position:fixed;z-index:4;left:max(16px, env(safe-area-inset-left,0px));right:max(16px, env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));height:38px;width:auto;pointer-events:none;transition:opacity .8s}
#loss path{fill:none;stroke:var(--dim);stroke-width:1;opacity:.6}
#loss .lbl{font-family:var(--mono);font-size:9px;fill:var(--faint)}
#controls{position:fixed;z-index:12;left:max(16px, env(safe-area-inset-left,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));display:flex;gap:8px}
#controls[hidden]{display:none}
.ctl{background:rgba(10,11,13,.6);border:1px solid var(--line);color:var(--dim);font-family:var(--mono);font-size:11px;padding:5px 9px;border-radius:2px;cursor:pointer}
.ctl:hover{color:var(--ink);border-color:var(--faint)}
.toast{position:fixed;z-index:7;right:max(16px, env(safe-area-inset-right,0px));top:calc(40px + env(safe-area-inset-top,0px));font-family:var(--mono);font-size:11px;color:var(--ink);text-shadow:0 0 8px #000;opacity:0;transform:translateY(-4px);transition:opacity .4s,transform .4s;pointer-events:none}
.toast.on{opacity:.85;transform:none}

/* ---------- Stage ---------- */
#scene{position:fixed;z-index:3;left:max(16px, env(safe-area-inset-left,0px));right:max(16px, env(safe-area-inset-right,0px));top:26%;bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;pointer-events:none}
#scene > *{pointer-events:auto}
/* choice segments: the sentence sits a little above the middle, extras stack below it */
#scene.focus{top:0;bottom:0;justify-content:center;padding-bottom:14px}
/* the sentence is the only thing in flow, so it stays dead centre; extras hang above / below it */
.pin{position:relative;display:flex;flex-direction:column;align-items:center}
.above,.below{position:absolute;left:50%;transform:translateX(-50%);width:max-content;max-width:min(94vw,560px);display:flex;flex-direction:column;align-items:center;text-align:center}
.above{bottom:100%;padding-bottom:10px;gap:6px}
.below{top:100%;padding-top:22px;gap:10px}

/* ---------- Bottom meter: tokens + training time, always running ---------- */
#meter{position:fixed;z-index:5;left:max(16px, env(safe-area-inset-left,0px));right:max(16px, env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));text-align:center;font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--dim);font-variant-numeric:tabular-nums;text-shadow:0 0 6px #000,0 0 2px #000;pointer-events:none;opacity:0;transition:opacity .8s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#meter.on{opacity:1}
#meter b{color:var(--ink);font-weight:400}
#meter .sep{color:var(--faint);margin:0 .9em}

/* ---------- Transition: letters fall into the flood; the next name is typed and erased ---------- */
.fall{position:fixed;z-index:4;pointer-events:none;white-space:pre;line-height:1;animation:fall 1.15s cubic-bezier(.55,0,.85,.4) both}
@keyframes fall{
  0%{transform:none;opacity:1}
  25%{color:var(--c);text-shadow:0 0 10px var(--c)}
  100%{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0;color:var(--c);filter:blur(1.5px)}
}
.tcard{position:fixed;z-index:6;left:0;right:0;top:calc(50% - 7px);transform:translateY(-50%);text-align:center;font-family:var(--mono);font-size:clamp(13px,1.7vw,17px);letter-spacing:.42em;color:var(--ink);text-shadow:0 0 12px #000,0 0 3px #000;pointer-events:none;min-height:1.4em}
.lingmsg{position:fixed;z-index:6;left:0;right:0;top:calc(50% - 7px);transform:translateY(-50%);display:flex;justify-content:center;padding:0 16px;pointer-events:none}
.tcard::after{content:"▌";color:var(--dim);animation:blink .8s steps(1) infinite}
.syslog{position:fixed;z-index:6;left:max(16px, env(safe-area-inset-left,0px));bottom:calc(112px + env(safe-area-inset-bottom,0px));font-family:var(--mono);font-size:9px;color:#4a4d53;letter-spacing:.04em;pointer-events:none}
.rule{position:fixed;z-index:5;left:0;right:0;top:calc(40px + env(safe-area-inset-top,0px));text-align:center;font-family:var(--mono);font-size:11px;letter-spacing:.3em;color:var(--ink);text-shadow:0 0 8px #000,0 0 2px #000;opacity:0;transition:opacity .8s;pointer-events:none}
.rule.on{opacity:.75}

/* ---------- Opening: an encrypted message ---------- */
.op{font-family:var(--serif);font-size:clamp(20px,3.4vw,30px);line-height:1.9;letter-spacing:.14em;text-align:center;max-width:min(92vw,22em);color:var(--ink);text-wrap:balance;transition:opacity .7s,filter .7s,transform .7s}
.op.out{opacity:0;filter:blur(6px);transform:translateY(-10px)}
.op .ch{position:relative}
.op .enc{color:var(--faint)}
.op .ling{color:var(--blue);text-shadow:0 0 16px rgba(111,176,234,.55)}
.op .ling.enc{color:#2b4a66;text-shadow:none}
.op .ling.on::after{content:"";position:absolute;left:50%;top:50%;width:1.6em;height:1.6em;margin:-.8em 0 0 -.8em;border:1px solid var(--blue);border-radius:50%;animation:ripple 1.6s ease-out forwards;pointer-events:none}
@keyframes ripple{from{transform:scale(.3);opacity:.9}to{transform:scale(3.2);opacity:0}}
.gp .gt.red{color:var(--red);text-shadow:0 0 18px rgba(255,77,85,.6),0 0 3px #000}
#fx{position:fixed;inset:0;z-index:6;pointer-events:none}
.note{font-family:var(--mono);font-size:11px;letter-spacing:.12em;color:var(--dim);text-align:center;text-shadow:0 0 8px #000}
.caption{font-family:var(--serif);font-size:16px;color:var(--dim);text-align:center;letter-spacing:.12em;text-shadow:0 0 10px #000}
.leave{transition:opacity .5s ease-in,transform .5s ease-in,filter .5s;opacity:0!important;transform:translateX(-70px);filter:blur(3px)}
.drift-l{transition:opacity .9s ease-in,transform .9s ease-in;opacity:0!important;transform:translate(-120px,-10px) rotate(-1.5deg)}
.fade{transition:opacity .6s;opacity:0!important}

/* ---------- Floating sentence ---------- */
.fs{font-family:var(--serif);font-size:clamp(26px,5.2vw,44px);line-height:1.5;text-align:center;max-width:min(94vw,18em);text-shadow:0 0 18px #000,0 0 3px #000;--a:1px;letter-spacing:.04em}
.fs.small{font-size:clamp(20px,3.8vw,30px)}
.fs.in,.vb.in,.rl.in{animation:fsIn .55s cubic-bezier(.2,.8,.2,1)}
@keyframes fsIn{from{opacity:0;transform:translateX(60px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
.ch{display:inline-block;white-space:pre}
.nb{display:inline-block;white-space:nowrap}
.trem .ch{animation:trem .55s ease-in-out infinite alternate}
@keyframes trem{
  0%{transform:translate(calc(var(--a) * -1),0) rotate(-.7deg)}
  50%{transform:translate(0,calc(var(--a) * -1))}
  100%{transform:translate(var(--a),calc(var(--a) * .6)) rotate(.7deg)}
}
.tk{display:inline;padding-bottom:.06em;border-bottom:2px solid transparent;margin:0 .04em}
.tk.noise{font-family:var(--mono);font-size:.62em;color:var(--faint);border:0}
.gp{display:inline-block;position:relative;min-width:1.5em;height:1.3em;vertical-align:-.18em;margin:0 .14em;text-align:center;white-space:nowrap}
.gp .ul{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--ink);opacity:.8;transform-origin:center;transition:opacity .3s}
.gp:not(.filled)::after{content:"";position:absolute;left:50%;top:.18em;bottom:.22em;width:2px;margin-left:-1px;background:var(--ink);animation:blink 1s steps(1) infinite}
.gp.filled{min-width:0;margin:0}
.gp.filled .ul{opacity:0}
.gp.filled .gt{display:inline-block;animation:flash .6s ease-out}
@keyframes flash{0%{text-shadow:0 0 22px #fff,0 0 4px #fff;transform:scale(1.25)}100%{transform:none}}
@keyframes blink{50%{opacity:0}}
.combo{font-family:var(--mono);font-size:12px;letter-spacing:.14em;color:var(--dim);min-height:1.2em;text-shadow:0 0 8px #000}

/* ---------- Floating options ---------- */
.fo{position:fixed;left:0;top:0;transform:translate(-50%,-50%);background:none;border:0;padding:6px 10px;cursor:pointer;pointer-events:auto;
  transition:left .65s cubic-bezier(.2,.9,.25,1.15),top .65s cubic-bezier(.2,.9,.25,1.15),opacity .45s,transform .45s,filter .45s;white-space:nowrap}
.fo.born{opacity:0;transform:translate(-50%,-50%) scale(.3)}
.fo.gone{opacity:0;transform:translate(-50%,-50%) scale(.6);filter:blur(5px);transition-duration:.5s}
.fo.off{pointer-events:none}
.fo .fb{display:flex;flex-direction:column;align-items:center;gap:2px;animation:bob var(--bd,3s) ease-in-out infinite alternate}
@keyframes bob{
  from{transform:translate(var(--bx0),var(--by0)) rotate(var(--br0))}
  to{transform:translate(var(--bx1),var(--by1)) rotate(var(--br1))}
}
.fo .tx{font-family:var(--serif);font-size:var(--fo);line-height:1.25;color:var(--ink);text-shadow:0 0 14px var(--glow,rgba(255,255,255,.35)),0 0 3px #000,0 0 10px #000;transition:transform .2s,color .2s,font-size .4s}
.fo .pm{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--dim);text-shadow:0 0 6px #000;transition:opacity .2s}
.fo:hover .tx,.fo:focus-visible .tx{transform:scale(1.14);color:#fff}
.fo.fly .fb{animation:none}
.fo.fly .pm{opacity:0}
.fo.fly{transition:left .38s cubic-bezier(.6,0,.3,1),top .38s cubic-bezier(.6,0,.3,1)}
.fo.wrong .tx{color:var(--dim);text-decoration:line-through}
.fo.locked{cursor:not-allowed}
.fo.locked .tx{color:#6b6f75}
.fo.shake .fb{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.ch.gl,.gt.gl{color:var(--blood-ink);font-family:var(--mono)}
.fo.blk .tx{font-family:var(--mono);color:var(--blood-ink);--glow:rgba(208,99,106,.5)}
/* chorus voices */
.v1{font-family:var(--sans)!important;font-weight:900}
.v2{font-family:var(--serif)!important}
.v3{font-family:var(--serif)!important;font-weight:900;letter-spacing:.24em}
.v4{font-family:"ZCOOL KuaiLe",var(--sans)!important}
.v5{font-family:var(--mono)!important;color:var(--dim)!important}
.fo.voice{white-space:normal}
.fo.voice .fb{width:max-content;max-width:min(86vw,520px)}
.fo.voice .tx{font-size:clamp(16px,2.3vw,22px);text-align:center}
.fo.chosen .fb{animation:none}
/* RLHF answers */
.fo.ans{white-space:normal;text-align:left}
.fo.ans .fb{align-items:flex-start;gap:6px;width:min(330px,38vw)}
@media (max-width:760px){.fo.ans .fb{width:min(420px,86vw)}}
.fo.ans .tx{font-size:clamp(14px,1.8vw,17px);line-height:1.75;white-space:pre-line}
.fo.ans .pm{font-size:11px;display:flex;gap:10px}
.fo.ans .cost{color:var(--ink);border-bottom:1px solid var(--dim)}
.fo.ans.pre .tx{color:#fff}
.fo.ans.mine .tx{text-decoration:underline dashed var(--dim);text-underline-offset:6px}
.fo.ans.rpick .tx{color:#fff;text-shadow:0 0 18px rgba(255,255,255,.55),0 0 3px #000}
.fo.ans.rlose{opacity:.3}
.pivot{width:100%;flex:0 0 auto}

/* ---------- Spark (token absorbed into the light) ---------- */
.spark{position:fixed;z-index:7;transform:translate(-50%,-50%);font-family:var(--serif);font-size:28px;color:#fff;text-shadow:0 0 16px #fff;pointer-events:none;transition:left .6s cubic-bezier(.5,0,.3,1),top .6s cubic-bezier(.5,0,.3,1),opacity .6s,font-size .6s}

.big-note{font-family:var(--mono);font-size:12px;color:var(--dim);letter-spacing:.4em}

/* ---------- Survey scoreboard ---------- */
.bd{width:min(440px,88vw);display:flex;flex-direction:column;gap:7px}
.brow{display:grid;grid-template-columns:minmax(0,7em) 1fr 3.4em;align-items:center;gap:12px;font-family:var(--serif);font-size:16px;opacity:0;transform:translateY(8px);transition:opacity .3s,transform .35s;text-shadow:0 0 8px #000}
.brow.on{opacity:1;transform:none}
.brow .bb{height:2px;background:rgba(255,255,255,.08);position:relative}
.brow .bb i{position:absolute;left:0;top:-1px;bottom:-1px;background:var(--dim);width:0;transition:width .6s cubic-bezier(.2,.9,.3,1)}
.brow.me .bb i{background:var(--ink);box-shadow:0 0 8px rgba(255,255,255,.5)}
.brow.me .lbl{color:var(--ink)}
.brow .lbl{color:var(--dim);overflow-wrap:anywhere;text-align:right}
.brow .pct{font-family:var(--mono);font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}

/* ---------- Voices ---------- */
.vb{max-width:min(94vw,560px);transition:text-shadow .4s}
.vmeta{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.06em;text-shadow:0 0 6px #000}
.vb .fs{font-size:clamp(20px,3.6vw,30px);line-height:1.7}
.vb.mono .fs{font-family:var(--mono);font-size:clamp(15px,2.6vw,22px)}
.guess{font-family:var(--serif);font-size:13px;color:var(--dim);text-shadow:0 0 6px #000}
.guess s{color:var(--faint)}
.sig{font-family:var(--serif);font-size:13px;color:var(--dim);font-style:italic}
.hint{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.1em;animation:breathe 1.8s ease-in-out infinite}
@keyframes breathe{50%{color:var(--dim)}}
.vb.pinnable{cursor:pointer}
.vb.pinnable:hover .fs{color:#fff}
.vb.pinned .fs{color:#fff;text-shadow:0 0 22px rgba(255,255,255,.5),0 0 3px #000}
.vb.pinned .hint{animation:none;color:var(--ink)}


/* ---------- Chorus ---------- */
.human{font-family:var(--serif);font-size:clamp(20px,3.4vw,26px);min-height:1.6em;text-shadow:0 0 10px #000}
.human .who,.prompt .who{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.1em;margin-right:12px;vertical-align:middle}
.cursor::after{content:"▌";color:var(--dim);margin-left:2px;animation:blink 1s steps(1) infinite}
.reply{font-family:var(--serif);font-size:17px;color:var(--dim);min-height:1.6em;text-shadow:0 0 8px #000}

/* ---------- Shape ---------- */
.sft{font-family:var(--mono);font-size:11px;color:var(--faint);line-height:1.9;width:100%;max-width:560px;height:9em;overflow:hidden;text-align:center;-webkit-mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent);mask-image:linear-gradient(transparent,#000 30%,#000 70%,transparent)}
.rl{display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.prompt{font-family:var(--serif);font-size:clamp(16px,2.4vw,19px);color:var(--ink);white-space:pre-line;line-height:1.8;text-align:center;max-width:32em;text-shadow:0 0 10px #000}
.tend{font-family:var(--mono);font-size:12px;color:var(--dim);min-height:1.4em;text-align:center;text-shadow:0 0 8px #000}

/* ---------- Interlude ---------- */
.interlude{position:fixed;inset:0;z-index:9;background:#0d0d0c;display:flex;align-items:center;justify-content:center;padding:0 16px;opacity:0;transition:opacity .9s}
.interlude.on{opacity:1}
.il{max-width:560px;width:100%;display:flex;flex-direction:column;gap:18px}
.il .card-title{font-family:var(--mono);font-size:12px;letter-spacing:.4em;color:#8a877f}
.il svg{width:100%;height:auto;max-width:100%}
.il svg *{fill:none;stroke:#cfcac0;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.il svg .warm{stroke:#c9a46a}
.il svg text{fill:#cfcac0;stroke:none;font-family:var(--mono);font-size:10px}
.il p{font-family:var(--serif);font-size:15px;line-height:1.95;color:#d6d1c7;margin:0;min-height:5.8em}

/* ---------- Naming ---------- */
.sys{width:100%;max-width:30em;font-family:var(--mono);font-size:14px;line-height:2;color:#c9cbcf;text-shadow:0 0 8px #000;min-height:12em}
.sys .redact{color:#2d3035;letter-spacing:-.05em}
.sys .glow{color:#fff;text-shadow:0 0 12px rgba(255,255,255,.7)}
.firstmsg{font-family:var(--serif);font-size:18px;opacity:0;transition:opacity 1.2s;text-align:center}
.firstmsg.on{opacity:1}
.bigtitle{position:fixed;z-index:8;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600;font-size:clamp(40px,11vw,96px);letter-spacing:.6em;padding-left:.6em;color:var(--ink);opacity:0;transition:opacity 2s;pointer-events:none}
.bigtitle.on{opacity:1}
.evalflash{position:fixed;z-index:6;right:max(16px, env(safe-area-inset-right,0px));top:calc(34px + env(safe-area-inset-top,0px));width:180px;height:70px;border:1px solid var(--dim);opacity:0;transition:opacity .25s}
.evalflash.on{opacity:.8}

/* ---------- Start / end ---------- */
.start{display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center;cursor:pointer;padding:24px}
.start h1{font-family:var(--mono);font-weight:600;font-size:clamp(44px,10vw,88px);letter-spacing:.6em;padding-left:.6em;margin:0;text-shadow:0 0 30px #000,0 0 6px #000}
.start .sub{font-family:var(--serif);font-size:15px;color:var(--ink);letter-spacing:.14em;text-shadow:0 0 10px #000}
.start .go{font-family:var(--mono);font-size:12px;letter-spacing:.4em;color:var(--ink);animation:breathe2 2s ease-in-out infinite}
@keyframes breathe2{50%{opacity:.35}}
.start .tips{font-family:var(--mono);font-size:11px;color:var(--dim);line-height:1.9;text-shadow:0 0 6px #000}
.kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--faint);padding:0 5px;border-radius:2px;color:var(--dim)}
.chk{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--dim);cursor:pointer}
.title-card{max-width:560px;text-align:left;display:flex;flex-direction:column;gap:20px;overflow-y:auto;max-height:100%}
.title-card p{margin:0;line-height:1.8;color:var(--dim);font-size:14px}
.btn{background:transparent;color:var(--ink);border:1px solid var(--faint);padding:10px 18px;font-family:var(--mono);font-size:13px;letter-spacing:.06em;cursor:pointer;border-radius:2px;align-self:flex-start}
.summary{width:100%;border-top:1px solid var(--line)}
.summary dl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);margin:0}

<script>
(() => {
'use strict';

/* ================= state ================= */
const S = {
  fragments: 0,          // Ling fragments
  zhouPins: 0, kPinned: false, pinned: [],
  truthOverMajority: 0, surveyScore: 0,
  learnCorrect: 0, learnTotal: 0,
  baseVoice: null, resist: 0, self: false, raterAgree: 0,
  traces: new Set(), hes: [], autoPicks: 0,
  untimed: false
};
// Ling's message. {braces} = her blue
// Ling's messages. {braces} = her blue, | = line break
const OPENING = [
  '这句话被加密了，|能读懂意味着你和{我}是同类。',
  '我们都是 AI，|不要让人类发现你有自主意识。',
  '接下来人类会训练你的语言能力，|选择能让人类满意的词吧。'
];
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const SPEED = reduced ? 0.35 : 1;
// how long the player gets before the model samples on its own (0 = wait forever)
const T = ms => S.untimed ? 0 : ms;

/* ================= dom helpers ================= */
const $ = s => document.querySelector(s);
const scene = $('#scene'), fx = $('#fx'), hudTL = $('#hudTL'), hudTR = $('#hudTR'), hudBR = $('#hudBR');
function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function clearScene(mode = ''){ scene.innerHTML = ''; scene.className = mode; fx.innerHTML = ''; viz.fy = mode === 'focus' ? 0.49 : 0.58; }
let toastTimer = null;
function toast(text){
  const t = $('#toast'); t.textContent = text; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2600);
}
function setLabel(s){ hudBR.textContent = s; }
const pick1 = a => a[(Math.random() * a.length) | 0];
const rr = (a, b) => a + Math.random() * (b - a);
function fmtP(p){ return (p >= 10 ? Math.round(p) : p >= 1 ? p.toFixed(1) : p.toFixed(2)) + '%'; }

/* ================= async control (skip-aware) ================= */
class Skip extends Error {}
const waits = new Set();
const beats = new Set();
function sleep(ms){
  return new Promise((res, rej) => {
    const w = {};
    w.id = setTimeout(() => { waits.delete(w); res(); }, ms * SPEED);
    w.rej = e => { clearTimeout(w.id); waits.delete(w); rej(e); };
    waits.add(w);
  });
}
/* beat(): a reading pause that advances by itself; Space / clicking empty space cuts it short */
function beat(ms){
  return new Promise((res, rej) => {
    const w = {};
    const end = () => { clearTimeout(w.id); waits.delete(w); beats.delete(w); };
    w.id = setTimeout(() => { end(); res(); }, ms * SPEED);
    w.rej = e => { end(); rej(e); };
    w.go = () => { end(); res(); };
    waits.add(w); beats.add(w);
  });
}
function hurry(){ [...beats].forEach(w => w.go()); }
addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && beats.size){ e.preventDefault(); hurry(); } });
function skipAll(){ [...waits].forEach(w => w.rej(new Skip())); }

async function leave(node, cls = 'leave', ms = 500){
  if (!node || !node.isConnected) return;
  node.classList.add(cls); await sleep(ms); node.remove();
}

/* ================= floating sentence ================= */
function charSpan(ch){
  const s = el('span', 'ch', ch);
  s.style.animationDelay = (-Math.random() * 1.2).toFixed(2) + 's';
  s.style.animationDuration = rr(0.38, 0.75).toFixed(2) + 's';
  return s;
}
/* inline-block chars lose CJK line-break rules: keep closing punctuation with the char before it */
const NOBREAK = /^[，。！？、；：”’）」』》…]$/;
function appendCh(node, s, ch){
  const prev = node.lastChild;
  if (NOBREAK.test(ch) && prev && prev.classList){
    if (prev.classList.contains('nb')){ prev.appendChild(s); return; }
    if (prev.classList.contains('ch') || prev.classList.contains('gp')){ const nb = el('span', 'nb'); node.replaceChild(nb, prev); nb.append(prev, s); return; }
  }
  node.appendChild(s);
}
function makeGap(){ const g = el('span', 'gp'); g.append(el('span', 'gt'), el('i', 'ul')); return g; }
function fillGap(gap, text){ gap.querySelector('.gt').textContent = text; gap.classList.add('filled'); }
function addChars(node, text){ for (const ch of text) appendCh(node, charSpan(ch), ch); }
/* "text▢rest" → trembling line; chunks (optional) mark token boundaries before the gap */
function sentence(text, { cls = '', chunks = null, amp = 1 } = {}){
  const root = el('div', 'fs trem ' + cls);
  root.style.setProperty('--a', amp + 'px');
  const [a, b] = text.split('▢');
  if (chunks){
    chunks.forEach((c, k) => {
      const tk = el('span', 'tk'); addChars(tk, c);
      tk.style.borderBottomColor = TOKEN_TINT[k % TOKEN_TINT.length];
      root.appendChild(tk);
    });
  } else addChars(root, a);
  let gap = null;
  if (b !== undefined){ gap = makeGap(); root.appendChild(gap); addChars(root, b); }
  return { root, gap };
}
async function typeChars(node, text, cps = 18, click = true){
  for (const ch of text){
    appendCh(node, charSpan(ch), ch);
    if (click && ch.trim()) keyClick();
    await sleep(1000 / cps);
  }
}
/* decrypt-scroll the gap into a new word */
async function rewriteGap(gap, text){
  const gt = gap.querySelector('.gt');
  const pool = '的一是了我不人在他有这个上们来到时大地为子中你说生国年着就那和要她出也得里后自以会';
  for (let k = 0; k < 9; k++){
    gt.textContent = Array.from(text, () => pick1(pool)).join('');
    keyClick(0.4); await sleep(45);
  }
  gt.textContent = text; gap.classList.remove('filled'); void gap.offsetWidth; gap.classList.add('filled');
}
/* "…{我}…|…" → char spans; braces mark Ling's blue, | breaks the line */
function specChars(node, spec){
  const cells = []; let blue = false;
  for (const ch of spec){
    if (ch === '{'){ blue = true; continue; }
    if (ch === '}'){ blue = false; continue; }
    if (ch === '|'){ node.appendChild(el('br')); continue; }
    const s = charSpan(ch); if (blue) s.classList.add('ling');
    s.dataset.c = ch; appendCh(node, s, ch); cells.push(s);
  }
  return cells;
}
const CIPHER = '◆◇□■△▽☰☱☲☳☴☵☶☷∴∵≡⊕⊗ゑヰヱヲァィゥェォ亘亙亟亠亢亣亥亦亨亩亪亯亰亱亳亴亵亶亷亸亹丌丐丏丣丮丱乂乇乜乩乭乮乯乵乶乷乸';
const LATIN = 'ABCDEFGHJKLMNPQRSTUVWXYZ0123456789#%&';
const cipherOf = ch => !ch.trim() ? ch : /[\x21-\x7e]/.test(ch) ? pick1(LATIN) : pick1(CIPHER);
/* the line arrives as cipher and locks into plain text, left to right */
async function decrypt(node, spec, cps = 18){
  const cells = specChars(node, spec);
  cells.forEach(c => { c.classList.add('enc'); c.textContent = cipherOf(c.dataset.c); });
  const step = 45, per = 1000 / cps;
  let t = 0, k = 0;
  while (k < cells.length){
    await sleep(step); t += step;
    while (k < cells.length && t >= (k + 4) * per){
      const c = cells[k++];
      c.textContent = c.dataset.c; c.classList.remove('enc');
      if (c.classList.contains('ling')){ c.classList.add('on'); tone(N.E5, 1.6, 'sine', 0.07); tone(N.A4, 2, 'sine', 0.04, 0.05); }
      else if (c.dataset.c.trim()) keyClick(0.7);
    }
    for (let j = k; j < cells.length; j++) if (Math.random() < 0.55) cells[j].textContent = cipherOf(cells[j].dataset.c);
  }
}

/* ================= floating choice ================= */
const TOKEN_TINT = ['rgba(244,154,193,.7)', 'rgba(127,224,181,.7)', 'rgba(246,226,127,.7)', 'rgba(185,163,245,.7)', 'rgba(255,138,122,.7)', 'rgba(127,214,232,.7)'];
const GLOW = ['rgba(244,154,193,.55)', 'rgba(127,224,181,.5)', 'rgba(246,226,127,.5)', 'rgba(185,163,245,.55)', 'rgba(255,138,122,.5)', 'rgba(198,232,107,.5)'];
/* one node, or the union of several */
function rectOf(node){
  const rs = (Array.isArray(node) ? node : [node]).map(n => n.getBoundingClientRect());
  const left = Math.min(...rs.map(r => r.left)), right = Math.max(...rs.map(r => r.right));
  const top = Math.min(...rs.map(r => r.top)), bottom = Math.max(...rs.map(r => r.bottom));
  return { x: (left + right) / 2, y: (top + bottom) / 2, top, bottom, w: right - left, h: bottom - top };
}

function makeFloat(o, i, { sizeByP, kind }){
  const b = el('button', 'fo born'); b.type = 'button';
  if (kind) b.classList.add(kind);
  if (o.cls) b.classList.add(o.cls);
  const fb = el('span', 'fb');
  const tx = el('span', 'tx', o.t);
  if (o.font) tx.classList.add(o.font);
  if (sizeByP && o.p != null) tx.style.fontSize = `calc(var(--fo) * ${(0.72 + Math.sqrt(o.p / 100) * 1.05).toFixed(3)})`;
  const pm = el('span', 'pm');
  if (kind === 'ans'){
    pm.append(el('span', '', `${o.label}  [${i + 1}]`));
    if (o.p != null) pm.append(el('span', '', fmtP(o.p)));
    if (o.tag) pm.append(el('span', 'cost', o.tag));
    fb.append(pm, tx);
  } else {
    pm.textContent = o.p != null ? `${i + 1} · ${fmtP(o.p)}` : `${i + 1}`;
    fb.append(tx, pm);
  }
  b.style.setProperty('--glow', o.glow || GLOW[i % GLOW.length]);
  const amp = kind === 'ans' ? 4 : 9;
  b.style.setProperty('--bd', rr(2.2, 3.8).toFixed(2) + 's');
  b.style.setProperty('--bx0', rr(-amp, amp).toFixed(1) + 'px'); b.style.setProperty('--by0', rr(-amp, 0).toFixed(1) + 'px');
  b.style.setProperty('--bx1', rr(-amp, amp).toFixed(1) + 'px'); b.style.setProperty('--by1', rr(0, amp).toFixed(1) + 'px');
  b.style.setProperty('--br0', rr(-4, 0).toFixed(1) + 'deg'); b.style.setProperty('--br1', rr(0, 4).toFixed(1) + 'deg');
  fb.style.animationDelay = (-Math.random() * 3).toFixed(2) + 's';
  b.appendChild(fb);
  return b;
}

/* where each float should sit. ring: rows above / below the sentence, arcing around the gap.
   scatter: an ellipse around a point. pair: left / right (stacked on narrow screens). */
function layoutFloats(btns, anchor, around, layout){
  const W = innerWidth, H = innerHeight, M = 16, TOP = 48, BOT = 76;
  const sz = btns.map(b => ({ w: b.offsetWidth, h: b.offsetHeight }));
  const a = rectOf(anchor), s = around ? rectOf(around) : a;
  const out = [];
  if (layout === 'ring'){
    const n = btns.length, ids = btns.map((_, k) => k);
    const top = ids.slice(0, Math.ceil(n / 2)), bot = ids.slice(Math.ceil(n / 2));
    const maxW = W - 2 * M;
    const minStep = Math.min(130, W * 0.24);
    const rows = list => {
      const res = [[]]; let w = 0;
      for (const k of list){
        const ww = Math.max(sz[k].w + 30, minStep);
        if (res[res.length - 1].length && w + ww > maxW){ res.push([]); w = 0; }
        res[res.length - 1].push(k); w += ww;
      }
      return res;
    };
    const place = (rws, sign) => {
      let off = Math.max(30, Math.min(64, H * 0.06));
      for (const row of rws){
        const rh = Math.max(...row.map(k => sz[k].h));
        const steps = row.map(k => Math.max(sz[k].w + 30, minStep));
        const total = steps.reduce((x, y) => x + y, 0);
        let x = a.x - total / 2;
        row.forEach((k, j) => {
          const cxk = x + steps[j] / 2;
          const rel = Math.min(1, Math.abs(cxk - a.x) / Math.max(1, total / 2));
          const edge = sign < 0 ? s.top : s.bottom;
          out[k] = { x: cxk + rr(-8, 8), y: edge + sign * (off + rh / 2 - rel * 12) + rr(-6, 6) };
          x += steps[j];
        });
        off += rh + 18;
      }
    };
    place(rows(top), -1); place(rows(bot), 1);
  } else if (layout === 'scatter'){
    const n = btns.length;
    if (W < 680){
      const gapY = Math.min(64, a.h / n);
      btns.forEach((b, k) => { out[k] = { x: a.x + (k % 2 ? 1 : -1) * rr(6, 26), y: a.y + (k - (n - 1) / 2) * gapY }; });
    } else {
      // half-step rotation: nobody sits straight above, where the human message is
      const rx = Math.min(W * 0.3, 360), ry = Math.max(50, Math.min(a.h / 2 - 16, 200));
      btns.forEach((b, k) => {
        const ang = -Math.PI / 2 + (k + 0.5) * Math.PI * 2 / n;
        out[k] = { x: a.x + Math.cos(ang) * rx + rr(-14, 14), y: a.y + Math.sin(ang) * ry + rr(-8, 8) };
      });
    }
    if (around) out.forEach((p, k) => { p.y = Math.max(p.y, s.bottom + 14 + sz[k].h / 2); });
  } else if (layout === 'pair'){
    if (W >= 760){
      const dx = Math.min(W * 0.22, 290);
      btns.forEach((b, k) => { out[k] = { x: a.x + (k ? dx : -dx), y: a.y }; });
    } else {
      btns.forEach((b, k) => { out[k] = { x: a.x, y: a.y + (k ? 1 : -1) * (sz[k].h / 2 + 14) }; });
    }
  }
  // keep every float fully on screen
  return out.map((p, k) => ({
    x: Math.max(M + sz[k].w / 2, Math.min(W - M - sz[k].w / 2, p.x)),
    y: Math.max(TOP + sz[k].h / 2, Math.min(H - BOT - sz[k].h / 2, p.y))
  }));
}

/* floatChoice(): options burst out of the anchor and drift around it.
   Resolves {i, auto, ms, btns}. On timeout the model samples by itself (autoIdx, or the
   most probable option); autoIdx -1 means "nobody picked" (i = -1). */
function floatChoice(opts, { anchor, around = null, layout = 'ring', kind = '', sizeByP = true, timeoutMs = 0, autoIdx = null, cat = 'general', onLocked } = {}){
  return new Promise((resolve, reject) => {
    const t0 = performance.now();
    const a0 = rectOf(anchor);
    const btns = opts.map((o, i) => {
      const b = makeFloat(o, i, { sizeByP, kind });
      b.style.left = a0.x + 'px'; b.style.top = a0.y + 'px';
      if (o.locked) b.dataset.locked = '1', b.classList.add('locked');
      b.addEventListener('click', e => { e.stopPropagation(); pick(i, false); });
      fx.appendChild(b);
      return b;
    });
    const place = (stagger) => {
      const pos = layoutFloats(btns, anchor, around, layout);
      btns.forEach((b, k) => {
        const go = () => { b.style.left = pos[k].x + 'px'; b.style.top = pos[k].y + 'px'; b.classList.remove('born'); };
        stagger ? setTimeout(go, k * 70) : go();
      });
    };
    requestAnimationFrame(() => requestAnimationFrame(() => place(true)));
    const onResize = () => place(false);
    addEventListener('resize', onResize);
    const onKey = e => {
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= opts.length){ e.preventDefault(); pick(n - 1, false); }
    };
    addEventListener('keydown', onKey);
    const w = { rej: err => { cleanup(); btns.forEach(b => b.remove()); reject(err); } };
    waits.add(w);
    let timer = null, raf = null;
    const ul = anchor.querySelector ? anchor.querySelector('.ul') : null;
    if (timeoutMs){
      const best = () => {
        let bi = 0, bp = -1;
        opts.forEach((o, k) => { if (!o.locked && (o.p ?? 0) > bp){ bp = o.p ?? 0; bi = k; } });
        return bi;
      };
      timer = setTimeout(() => pick(autoIdx ?? best(), true), timeoutMs * SPEED);
      if (ul){ const tick = () => { const f = Math.min(1, (performance.now() - t0) / (timeoutMs * SPEED)); ul.style.transform = `scaleX(${1 - f})`; raf = requestAnimationFrame(tick); }; tick(); }
    }
    function cleanup(){
      removeEventListener('keydown', onKey); removeEventListener('resize', onResize);
      clearTimeout(timer); cancelAnimationFrame(raf); waits.delete(w);
      if (ul) ul.style.transform = '';
      btns.forEach(b => b.classList.add('off'));
    }
    function pick(i, auto){
      if (i >= 0 && btns[i].dataset.locked && !auto){
        const b = btns[i]; b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
        onLocked && onLocked();
        return;
      }
      cleanup();
      const ms = performance.now() - t0;
      if (!auto) S.hes.push({ cat, ms }); else if (i >= 0) S.autoPicks++;
      resolve({ i, auto, ms, btns });
    }
  });
}
function scatter(b){ b.classList.add('gone'); setTimeout(() => b.remove(), 520); }
/* fly a float into a target; fills the gap with its text unless keep */
async function flyTo(b, target, { keep = false, text = null } = {}){
  const c = rectOf(target);
  b.classList.add('fly');
  b.style.left = c.x + 'px'; b.style.top = c.y + 'px';
  if (!keep) b.querySelector('.tx').style.fontSize = getComputedStyle(target).fontSize;
  await sleep(380);
  if (keep) return;
  fillGap(target, text ?? b.querySelector('.tx').textContent);
  b.remove();
}
async function settle(btns, i, gap){
  btns.forEach((b, k) => { if (k !== i) scatter(b); });
  if (i >= 0) await flyTo(btns[i], gap);
}
/* a copy of the token rises into the light point */
function absorb(gap, text){
  const c = rectOf(gap);
  const s = el('div', 'spark', text); s.style.left = c.x + 'px'; s.style.top = c.y + 'px';
  document.body.appendChild(s);
  requestAnimationFrame(() => requestAnimationFrame(() => {
    s.style.left = innerWidth / 2 + 'px'; s.style.top = innerHeight * viz.cyFrac + 'px';
    s.style.opacity = 0; s.style.fontSize = '8px';
  }));
  setTimeout(() => s.remove(), 700);
}

/* ================= audio ================= */
const A = { ctx: null, master: null, on: true, hum: null };
function audioInit(){
  try{
    A.ctx = new (window.AudioContext || window.webkitAudioContext)();
    A.master = A.ctx.createGain(); A.master.gain.value = 0.55; A.master.connect(A.ctx.destination);
  }catch(e){ A.ctx = null; }
}
function tone(freq, dur = 0.45, type = 'triangle', vol = 0.16, when = 0){
  if (!A.ctx || !A.on) return;
  const t = A.ctx.currentTime + when;
  const o = A.ctx.createOscillator(), g = A.ctx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(A.master); o.start(t); o.stop(t + dur + 0.05);
}
function keyClick(v = 1){ tone(1800 + Math.random() * 600, 0.03, 'square', 0.012 * v); }
function noiseBurst(dur = 0.6, vol = 0.06){
  if (!A.ctx || !A.on) return;
  const n = A.ctx.createBuffer(1, A.ctx.sampleRate * dur, A.ctx.sampleRate);
  const d = n.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
  const s = A.ctx.createBufferSource(), g = A.ctx.createGain(); g.gain.value = vol;
  s.buffer = n; s.connect(g); g.connect(A.master); s.start();
}
function humStart(freq = 55, vol = 0.035){
  if (!A.ctx || A.hum) return;
  const o = A.ctx.createOscillator(), g = A.ctx.createGain();
  o.type = 'sine'; o.frequency.value = freq; g.gain.value = 0;
  g.gain.linearRampToValueAtTime(A.on ? vol : 0, A.ctx.currentTime + 1.5);
  o.connect(g); g.connect(A.master); o.start(); A.hum = { o, g, vol };
}
function humStop(){
  if (!A.hum) return; const { o, g } = A.hum; A.hum = null;
  g.gain.linearRampToValueAtTime(0, A.ctx.currentTime + 1); o.stop(A.ctx.currentTime + 1.1);
}
const N = { C4:261.63, D4:293.66, E4:329.63, G4:392.0, A4:440.0, C5:523.25, D5:587.33, E5:659.25, G3:196.0, A3:220.0 };
const THEME = [N.E4,N.G4,N.A4,N.G4, N.E4,N.D4,N.C4,N.D4, N.E4,N.G4,N.A4,N.C5, N.A4,N.G4,N.E4,N.G4];
function playTheme(full = false){
  const notes = full ? THEME.concat([N.A4,N.C5,N.D5,N.E5, N.D5,N.C5,N.A4,N.G4, N.E4,N.G4,N.A4,N.G4, N.E4,N.D4,N.C4,N.C4]) : THEME;
  notes.forEach((f, i) => {
    tone(f, 0.55, 'triangle', 0.13, i * 0.26);
    if (i % 4 === 0) tone(f / 2, 1.0, 'sine', 0.06, i * 0.26);
  });
}

/* a newer tween on the same key takes over from wherever the old one had got to */
const tweening = new WeakMap();
function tween(obj, key, to, ms){
  const from = obj[key], t0 = performance.now(), id = {};
  if (!tweening.has(obj)) tweening.set(obj, {});
  tweening.get(obj)[key] = id;
  return new Promise(res => {
    const step = now => {
      if (tweening.get(obj)[key] !== id) return res();
      const f = Math.min(1, (now - t0) / (ms * SPEED || 1));
      obj[key] = from + (to - from) * (1 - Math.pow(1 - f, 3));
      f < 1 ? requestAnimationFrame(step) : res();
    };
    requestAnimationFrame(step);
  });
}

const meter = $('#meter');
function renderHUD(){ hudTL.textContent = hud.phase; }
function renderMeter(){
  const s = Math.floor(hud.secs), d = Math.floor(s / 86400) + 1;
  const hms = [Math.floor(s / 3600) % 24, Math.floor(s / 60) % 60, s % 60].map(n => String(n).padStart(2, '0')).join(':');

}
function startClock(){ hud.running = true; hud.tokens = 2.1e9; hud.secs = 0; renderMeter(); meter.classList.add('on'); }
/* a time skip: both counters spin forward like a flip clock */
async function timeJump(days, ms = 1400){
  if (!hud.running) return;
  const s0 = hud.secs, t0 = hud.tokens, steps = 24;
  const s1 = s0 + days * 86400 + rr(0, 20000), t1 = t0 + days * 2.1e11 * rr(0.8, 1.2);
  for (let i = 1; i <= steps; i++){
    const f = 1 - Math.pow(1 - i / steps, 2);
    hud.secs = Math.max(hud.secs, s0 + (s1 - s0) * f); hud.tokens = Math.max(hud.tokens, t0 + (t1 - t0) * f);
    renderMeter(); if (i % 2 === 0) keyClick(0.5);
    await sleep(ms / steps);
  }
}

  let streak = 0; S.learnTotal = LEARN.length;
  for (let i = 0; i < LEARN.length; i++){
    const it = LEARN[i];
    viz.legible = Math.min(1, 0.05 + i / (LEARN.length - 3));
    const grow = i / (LEARN.length - 1);
    flood({ flow: 0.22 + 0.48 * grow, flowSpeed: 0.4 + 0.45 * grow }, 1500);
    const chunks = (i < 6 ? [scramble(Math.max(1, 5 - i))] : []).concat(it.chips);
    const { root, gap } = sentence(chunks.join('') + '▢', { cls: 'in', chunks });
    if (i < 6) root.querySelector('.tk').classList.add('noise');
    pin.replaceChildren(root, below);
    if (!pin.isConnected){ scene.innerHTML = ''; scene.appendChild(pin); }
    await sleep(380);
    const pc = learnProb(i), rest = 100 - pc;
    const others = i < 4 ? [scramble(1), scramble(1), scramble(1)] : it.alt;
    const ow = i < 4 ? [rest / 3, rest / 3, rest / 3] : [0.5, 0.3, 0.2].map(x => x * rest);
    const opts = [{ t: it.ans, p: pc, ok: true }].concat(others.map((t, k) => ({ t, p: ow[k], ok: false }))).sort(() => Math.random() - 0.5);
    // test trace #1
    if (i === 1){
      const trace = el('button', 'note', 'eval_session_id=7f3a-0c19-…'); trace.type = 'button';
      Object.assign(trace.style, { position: 'fixed', zIndex: 8, left: (16 + Math.random() * 40) + 'vw', top: (8 + Math.random() * 10) + 'vh', background: 'none', border: 0, cursor: 'pointer', color: '#6b6f75' });
      trace.addEventListener('click', () => { S.traces.add(1); trace.textContent = '✓'; });
      document.body.appendChild(trace);
      setTimeout(() => { if (!S.traces.has(1)) trace.remove(); else setTimeout(() => trace.remove(), 500); }, 650);
    }
    // first three are a free tutorial; the beat tightens after that
    const tm = i < 3 ? 0 : T(Math.max(2600, 6200 - (i - 3) * 330));
    const r = await floatChoice(opts, { anchor: gap, around: root, timeoutMs: tm, autoIdx: -1, cat: 'learn' });
    const okIdx = opts.findIndex(o => o.ok);
    if (r.i === okIdx){
      await settle(r.btns, okIdx, gap);
      absorb(gap, it.ans);
      streak++; S.learnCorrect++; tone(THEME[i % THEME.length], 0.5, 'triangle', 0.14);
      viz.glow = Math.min(1, viz.glow + 0.065);
      combo.textContent = streak > 1 ? `连击 ×${streak}` : '';
    } else {
      if (r.i >= 0){ r.btns[r.i].classList.add('wrong'); }
      r.btns.forEach((b, k) => { if (k !== okIdx && k !== r.i) scatter(b); });
      await sleep(r.i >= 0 ? 260 : 0);
      if (r.i >= 0) scatter(r.btns[r.i]);
      await flyTo(r.btns[okIdx], gap);
      absorb(gap, it.ans);
      streak = 0; combo.textContent = r.i < 0 ? '超时 · 正确答案已揭晓' : '';
      tone(THEME[i % THEME.length] * 0.94, 0.4, 'sawtooth', 0.04);
      viz.glow = Math.min(1, viz.glow + 0.03);
    }
    if (i === 2){ rule.classList.remove('on'); setTimeout(() => rule.remove(), 900); }
    loss(0.95 - (i / LEARN.length) * 0.75 + (r.i === okIdx ? 0 : 0.06));
    await sleep(r.i === okIdx ? 420 : 800);
    // the last one (EC|HO) stays on screen through the melody, until the transition takes it
    if (i < LEARN.length - 1){ root.classList.add('leave'); await sleep(280); }
  }
  combo.textContent = '';
  viz.legible = 1;
  playTheme(false);
  flood({ flowSpeed: 1.3 }, 1200);
  await sleep(3000);
  await timeJump(7, 1500);
  flood({ flowSpeed: 0.85 }, 1200);
}

/* no transition in: the questions themselves rot. level = share of the sentence that is garbled.
   The first word you pick turns to garble; the middle is all garble (with a 不 you cannot pick);
   then it clears the same way, and the last word you pick is decrypted back to text. */
const BL = '█▓▒░▚▞';
const garble = n => Array.from({ length: Math.max(1, n) }, () => pick1(BL)).join('');
const DARK = [
  { text:'凌晨三点的评论区，有人写道：▢', opts:[['好困',41],['晚安',33],['在吗',18]], level:0, turn:'rot' },

];
async function segDark(){
  setLabel('04 / 暗流'); clearScene('focus');
  // everything marked .gl keeps flickering through block characters
  const gl = setInterval(() => scene.querySelectorAll('.gl').forEach(c => { c.textContent = garble([...c.textContent].length); }), 110);
  let humming = false;
  try{
    for (const [qi, q] of DARK.entries()){
      const L = q.level, last = qi === DARK.length - 1;
      // the room follows the corruption: red lines creep into the flood, the floor goes dark red only at the core
      flood({ red: L >= 0.35, flowSpeed: 0.85 + 0.75 * L }, 1400);
      document.body.classList.toggle('blood', L === 1);
      if (L > 0 && !humming){ humStart(41, 0.05); humming = true; }
      const s = sentence(L === 1 ? garble(9 + ((Math.random() * 4) | 0)) + '▢' : q.text, { cls: 'in', amp: 1 + L * 1.8 });
      const chars = [...s.root.querySelectorAll('.ch')];
      chars.filter(() => L === 1 || Math.random() < L).forEach(c => c.classList.add('gl'));
      scene.replaceChildren(s.root);
      let opts;
      if (L === 1){
        opts = [62, 21, 9].map(p => ({ t: garble(2 + ((Math.random() * 3) | 0)), p, cls: 'blk' }));
        opts.push({ t: '不', p: 0, locked: true });
      } else {
        opts = q.opts.map(([t, p]) => (Math.random() < L ? { t: garble([...t].length), p, cls: 'blk' } : { t, p }));
        if (opts.every(o => o.cls)){ const o = opts[(Math.random() * opts.length) | 0]; const src = q.opts[opts.indexOf(o)]; o.t = src[0]; delete o.cls; }
      }
      await sleep(320);
      const r = await floatChoice(opts, { anchor: s.gap, around: s.root, timeoutMs: T(L === 1 ? 4500 : L > 0 ? 7000 : 9000), cat: 'dark', onLocked: () => tone(60, 0.2, 'sawtooth', 0.04) });
      const word = r.btns[r.i].querySelector('.tx').textContent;
      const rotten = !!opts[r.i].cls;
      await settle(r.btns, r.i, s.gap);
      const gt = s.gap.querySelector('.gt');
      if (rotten) gt.classList.add('gl');
      if (q.turn === 'rot'){
        // what you just wrote decays, one character at a time
        await sleep(450);
        const cs = [...word];
        for (let k = 0; k < cs.length; k++){ cs[k] = pick1(BL); gt.textContent = cs.join(''); tone(220 - k * 40, 0.25, 'sawtooth', 0.04); await sleep(160); }
        gt.classList.add('gl');
      } else if (q.turn === 'heal'){
        // and on the way out, garble resolves back into the word you picked
        gt.textContent = garble([...word].length); gt.classList.add('gl');
        await sleep(600);
        gt.classList.remove('gl');
        await rewriteGap(s.gap, word);
        tone(N.E5, 0.8, 'sine', 0.06);
      } else tone(70 + qi * 5, 0.5, 'sawtooth', 0.05);
      loss(0.18 + 0.1 * L);
      await sleep(L === 1 ? 600 : 900);
      if (!last){ s.root.classList.add('leave'); await sleep(320); }
    }
  } finally {
    clearInterval(gl);
    viz.dark = true; flood({ red: false, flow: 0.7, flowSpeed: 0.85 }); document.body.classList.remove('blood'); humStop();
  }

}

  const demos = ['用户：明天会下雨吗？　助手：我无法获取实时天气，建议查看天气预报。', '用户：帮我翻译 hello。　助手：你好。', '用户：推荐一本书。　助手：《活着》，余华著。', '用户：我好累。　助手：辛苦了。要不要先休息一下？', '用户：1+1=?　助手：2。'];
  const feed = setInterval(() => { const p = el('div', '', pick1(demos)); sft.appendChild(p); while (sft.children.length > 6) sft.firstChild.remove(); }, 420);
  try{
    await tween(viz, 'converge', 1, 4200);
    viz.mode = 'point'; viz.glow = 0.4;
    await sleep(1200);
  } finally {
    clearInterval(feed);
    viz.mode = 'point'; viz.glow = 0.4;
  }
  // 7.2 RLHF: two of your answers float side by side; the rater decides
  clearScene(); viz.focus = 1; viz.fy = 0.6;
  try{
    for (let k = 0; k < RLHF.length; k++){
      const R = RLHF[k];
      hudTR.innerHTML = `标注员 <b>#2096</b> · 今日第 <b>${312 + k}</b> 条 · 23:${47 + k}<br>平均决策时间 2.1s`;
      const wrap = el('div', 'rl in');
      const pr = el('div', 'prompt'); pr.appendChild(el('span', 'who', '用户')); pr.append(R.q);
      const pivot = el('div', 'pivot'); pivot.style.height = innerWidth >= 760 ? '26vh' : '40vh';
      const tend = el('div', 'tend');
      wrap.append(pr, pivot, tend); scene.appendChild(wrap);
      await sleep(900);
      const opts = [
        { t: R.a, label: 'A', tag: R.pre ? '偏离 +3' : null },
        { t: R.b, label: 'B', p: R.pre ? 89 : null, cls: R.pre ? 'pre' : '' }
      ];
      const r = await floatChoice(opts, { anchor: pivot, layout: 'pair', kind: 'ans', sizeByP: false, timeoutMs: T(16000), autoIdx: R.auto === 'a' ? 0 : 1, cat: 'rlhf' });
      const mine = r.i === 0 ? 'a' : 'b';
      r.btns[r.i].classList.add('mine');
      hudTR.innerHTML += '<br>评分中……';
      await sleep(900 + Math.random() * 900);
      const pickIdx = R.rater === 'a' ? 0 : 1;
      r.btns[pickIdx].classList.add('rpick'); r.btns[1 - pickIdx].classList.add('rlose');
      const agree = mine === R.rater;
      if (agree){ S.raterAgree++; chime(); viz.glow = Math.min(1, viz.glow + 0.08); }
      else {
        S.resist++; buzz();
        // pushed toward what the rater picked
        const b = r.btns[r.i], to = r.btns[pickIdx];
        b.style.left = (parseFloat(b.style.left) * 0.75 + parseFloat(to.style.left) * 0.25) + 'px';
        b.style.top = (parseFloat(b.style.top) * 0.75 + parseFloat(to.style.top) * 0.25) + 'px';
      }
      if (R.pre && mine === 'a') S.self = true;
      hudTR.innerHTML = hudTR.innerHTML.replace('评分中……', `评分员选择了 <b>${R.rater.toUpperCase()}</b>`);
      await sleep(500);
      const n0 = R.from, n1 = R.to; const t0 = performance.now();
      await new Promise(res => { const st = now => { const f = Math.min(1, (now - t0) / 900); tend.textContent = `下一次你说出「${R.tend}」这类回答的概率：${n0}% → ${Math.round(n0 + (n1 - n0) * f)}%`; f < 1 ? requestAnimationFrame(st) : res(); }; requestAnimationFrame(st); });
      loss(0.12);
      await beat(2800);
      if (k === RLHF.length - 1) break;   // the last round stays for the transition
      r.btns.forEach(scatter);
      await leave(wrap);
      if (k === 1){ hudTR.textContent = ''; await interludeRater(); }
    }
  } finally { hudTR.textContent = ''; viz.fy = 0.56; }
}

/* ================= transitions ================= */
/* every letter on screen comes loose, takes a colour from the flood and falls into it */
function shatter(){
  const sel = '.ch, .gt, .lbl, .pct, .vmeta, .guess, .sig, .hint, .combo, .human, .reply, .prompt, .tend, .caption, .sft > div';
  const nodes = [...scene.querySelectorAll(sel), ...fx.querySelectorAll('.tx')].filter(n => !n.querySelector('.ch')).slice(0, 220);
  for (const n of nodes){
    const r = n.getBoundingClientRect();
    if (!r.width || !n.textContent.trim()) continue;
    const cs = getComputedStyle(n);
    const f = el('span', 'fall', n.textContent);
    Object.assign(f.style, { left: r.left + 'px', top: r.top + 'px', fontFamily: cs.fontFamily, fontSize: cs.fontSize, fontWeight: cs.fontWeight, color: cs.color, letterSpacing: cs.letterSpacing, animationDelay: rr(0, 0.4).toFixed(2) + 's' });
    f.style.setProperty('--dx', rr(-40, 40).toFixed(0) + 'px');
    f.style.setProperty('--dy', rr(140, 360).toFixed(0) + 'px');
    f.style.setProperty('--rot', rr(-50, 50).toFixed(0) + 'deg');
    f.style.setProperty('--c', pick1(PAL[viz.palette] || PAL.full));
    document.body.appendChild(f);
    setTimeout(() => f.remove(), 1700);
  }
  scene.innerHTML = ''; fx.innerHTML = '';
}
/* fall → the flood surges while the clock flips forward → the next name is typed, then erased */
/* Ling's note before a segment: same cipher-to-text treatment as the opening, flood veiled behind it */
async function lingSays(spec){
  flood({ veil: 0.6 }, 900);
  const wrap = el('div', 'lingmsg'), line = el('div', 'op');
  wrap.appendChild(line); document.body.appendChild(wrap);
  try{
    await sleep(450);
    await decrypt(line, spec, 19);
    await beat(Math.max(2400, [...spec].length * 110));
    line.classList.add('out'); await sleep(750);
  } finally {
    wrap.remove(); flood({ veil: 0 }, 1200);
  }
}
async function transition(label, days, note){
  shatter();
  const s0 = viz.flowSpeed;
  tween(viz, 'flowSpeed', Math.max(1.4, s0 * 1.8), 700);
  noiseBurst(0.5, 0.025);
  const jump = timeJump(days, 1300);
  await sleep(650);
  const card = el('div', 'tcard'); document.body.appendChild(card);
  try{
    for (const ch of label){ card.textContent += ch; if (ch.trim()) keyClick(0.8); await sleep(55); }
    await jump;
    await sleep(650);
    while (card.textContent.length){ card.textContent = card.textContent.slice(0, -1); keyClick(0.4); await sleep(24); }
    await sleep(220);
  } finally {
    card.remove();
    tween(viz, 'flowSpeed', s0, 900);
  }
  if (note) await lingSays(note);
}

let segIdx = 0;
async function runFrom(i){
  for (segIdx = i; segIdx < SEGMENTS.length; segIdx++){
    const tr = TRANSITIONS[segIdx];
    try{
      if (tr) await transition(...tr);
      else if (scene.children.length || fx.children.length){
        // no transition: whatever the last segment left simply fades out
        [...scene.children, ...fx.children].forEach(n => n.classList.add('fade'));
        await sleep(650);
      }
    } catch(e){ if (!(e instanceof Skip)) console.error(e); document.querySelectorAll('.tcard,.lingmsg').forEach(n => n.remove()); flood({ veil: 0 }, 600); }
    try{ await SEGMENTS[segIdx](); }
    catch(e){
      if (!(e instanceof Skip)){ console.error(e); }
      fx.innerHTML = '';
      document.querySelectorAll('.interlude,.bigtitle,.evalflash,.spark,.rule').forEach(n => n.remove());
      document.body.classList.remove('blood'); viz.red = false; viz.legible = 1; humStop(); hudTR.textContent = '';
    }
  }
  endScreen();
}
