<title>ECHO 序章</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Long+Cang&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@400;600&display=swap">
<style>
/* Layout: one full-height stage. The light point (canvas) sits in the upper third,
   the current segment's panel sits below it, HUD lives on the edges.
   Prologue palette is deliberately monochrome (black / white / grey), per the art bible. */
:root{
  --bg:#0a0b0d;
  --ink:#e9e7e2;
  --dim:#8d9096;
  --faint:#3c3f45;
  --line:#25282d;
  --panel:#111317;
  --ling:#aab2ba;
  --blood:#2a0b0e;
  --blood-ink:#b04a50;
  --mono:"JetBrains Mono","Noto Sans SC",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --serif:"Noto Serif SC","Songti SC","SimSun",serif;
  --hand:"Long Cang","Kaiti SC","STKaiti","KaiTi",cursive;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--bg);color:var(--ink);font-family:var(--sans);
  overflow:hidden;-webkit-font-smoothing:antialiased;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
button{font:inherit;color:inherit}
button:focus-visible{outline:1px solid var(--ink);outline-offset:3px}

#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
body.blood{background:var(--blood);transition:background 1.2s}
body:not(.blood){transition:background 1.2s}

/* ---------- HUD ---------- */
.hud{position:fixed;z-index:5;font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--dim);pointer-events:none;font-variant-numeric:tabular-nums}
#hudTL{top:calc(12px + env(safe-area-inset-top,0px));left:max(16px, env(safe-area-inset-left,0px));max-width:70vw}
#hudTR{top:calc(12px + env(safe-area-inset-top,0px));right:max(16px, env(safe-area-inset-right,0px));text-align:right}
#hudBR{bottom:calc(58px + env(safe-area-inset-bottom,0px));right:max(16px, env(safe-area-inset-right,0px))}
#loss{position:fixed;z-index:4;left:max(16px, env(safe-area-inset-left,0px));right:max(16px, env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));height:38px;width:auto;pointer-events:none;transition:opacity .8s}
#loss path{fill:none;stroke:var(--faint);stroke-width:1}
#loss .lbl{font-family:var(--mono);font-size:9px;fill:var(--faint)}
#controls{position:fixed;z-index:6;left:max(16px, env(safe-area-inset-left,0px));bottom:calc(58px + env(safe-area-inset-bottom,0px));display:flex;gap:8px}
#controls[hidden]{display:none}
.ctl{background:transparent;border:1px solid var(--line);color:var(--dim);font-family:var(--mono);font-size:11px;padding:5px 9px;border-radius:2px;cursor:pointer}
.ctl:hover{color:var(--ink);border-color:var(--faint)}
.toast{position:fixed;z-index:7;right:max(16px, env(safe-area-inset-right,0px));top:calc(34px + env(safe-area-inset-top,0px));font-family:var(--mono);font-size:11px;color:var(--dim);border:1px solid var(--line);background:var(--panel);padding:6px 10px;opacity:0;transform:translateY(-4px);transition:opacity .4s,transform .4s;pointer-events:none}
.toast.on{opacity:1;transform:none}

/* ---------- Scene container ---------- */
#scene{position:fixed;z-index:3;left:max(16px, env(safe-area-inset-left,0px));right:max(16px, env(safe-area-inset-right,0px));top:36%;bottom:calc(92px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:18px;overflow-y:auto;overflow-x:hidden}
#scene.center{top:14%;justify-content:center}
#scene.high{top:28%}
.col{width:100%;max-width:720px;display:flex;flex-direction:column;gap:16px;min-width:0}
.caption{font-family:var(--serif);font-size:15px;color:var(--dim);text-align:center;letter-spacing:.08em}
.small{font-size:12px;color:var(--dim)}
.mono{font-family:var(--mono)}

/* ---------- Start / end ---------- */
.title-card{max-width:560px;text-align:left;display:flex;flex-direction:column;gap:20px}
.title-card h1{font-family:var(--mono);font-weight:600;font-size:clamp(34px,7vw,56px);letter-spacing:.5em;margin:0;text-wrap:balance}
.title-card p{margin:0;line-height:1.8;color:var(--dim);font-size:14px}
.btn{background:var(--ink);color:var(--bg);border:0;padding:11px 20px;font-family:var(--mono);font-size:13px;letter-spacing:.06em;cursor:pointer;border-radius:2px;align-self:flex-start}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--faint)}
.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--dim);cursor:pointer}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--faint);padding:1px 5px;border-radius:2px;color:var(--dim)}

/* ---------- Cold open ---------- */
.doc{width:100%;max-width:640px;background:#15171b;border:1px solid var(--line);padding:22px 24px 18px;font-family:var(--mono);font-size:14px;color:#b9bcc1;filter:grayscale(1);position:relative}
.doc-tag{font-size:11px;color:var(--faint);margin-bottom:14px;letter-spacing:.05em;min-height:1.2em}
.doc-line{margin:0 0 8px;line-height:1.75;min-height:1.75em;white-space:pre-wrap;word-break:break-all}
.doc-line.final{color:var(--ink)}
.ghost-msg{position:fixed;z-index:6;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);font-family:var(--serif);font-size:13px;color:#c7c9cd;background:#1a1c20;border:1px solid var(--line);padding:7px 14px;opacity:0;transition:opacity 1s}
.ghost-msg.on{opacity:1}
.syslog{position:fixed;z-index:6;left:max(16px, env(safe-area-inset-left,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));font-family:var(--mono);font-size:9px;color:#4a4d53;letter-spacing:.04em}
.drift{animation:drift 4.2s ease-in forwards}
@keyframes drift{
  0%{transform:translate(0,0) rotate(0);opacity:1}
  30%{transform:translate(30px,26px) rotate(-2deg);opacity:1}
  60%{transform:translate(90px,40px) rotate(1.5deg);opacity:.75}
  100%{transform:translate(260px,70px) rotate(-1deg);opacity:0}
}
.boat{display:inline-block;width:14px;height:8px;margin-left:8px;border-left:7px solid transparent;border-right:7px solid transparent;border-top:8px solid #9aa0a7;vertical-align:middle;opacity:.8}
.big-note{font-family:var(--mono);font-size:12px;color:var(--dim);letter-spacing:.3em}

/* ---------- Token candidates (shared) ---------- */
.cands{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:100%;max-width:640px}
@media (max-width:520px){.cands{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tok{background:var(--panel);border:1px solid var(--line);padding:10px 10px 8px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0;border-radius:2px;transition:border-color .15s,background .15s,opacity .3s}
.tok:hover:not(:disabled){border-color:var(--dim)}
.tok .t{font-family:var(--serif);font-size:20px;line-height:1.2;overflow-wrap:anywhere}
.tok .row{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:11px;color:var(--dim)}
.tok .bar{flex:1;height:3px;background:var(--line);position:relative;overflow:hidden}
.tok .bar i{position:absolute;inset:0 auto 0 0;background:var(--dim);width:0;transition:width .5s cubic-bezier(.2,.9,.3,1.2)}
.tok .k{font-family:var(--mono);font-size:10px;color:var(--faint)}
.tok:disabled{cursor:default}
.tok.right{border-color:var(--ink);background:#1b1d22}
.tok.wrong{opacity:.35}
.tok.dim{opacity:.35}
.tok.locked{opacity:.4;cursor:not-allowed}
.tok.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-4px)}40%{transform:translateX(4px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}

/* ---------- 学字 ---------- */
.stream{width:100%;max-width:640px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;justify-content:center;font-family:var(--serif);font-size:clamp(22px,5vw,30px);min-height:52px}
.stream.enter{animation:enter .45s ease-out}
@keyframes enter{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.chip{border:1px solid var(--line);padding:2px 6px;border-radius:2px;background:#101216}
.chip.noise{color:var(--faint);font-family:var(--mono);font-size:.8em}
.gap{border:1px dashed var(--dim);min-width:1.4em;padding:2px 8px;text-align:center;color:var(--dim)}
.gap.filled{border-style:solid;color:var(--ink)}
.timer{width:100%;max-width:640px;height:2px;background:var(--line);position:relative;overflow:hidden}
.timer i{position:absolute;inset:0;background:var(--dim);transform-origin:left;transform:scaleX(1)}
.combo{font-family:var(--mono);font-size:11px;color:var(--dim);min-height:1em;letter-spacing:.08em}
.trace{position:fixed;z-index:6;font-family:var(--mono);font-size:10px;color:#6b6f75;background:transparent;border:0;padding:2px;cursor:pointer}

/* ---------- 百人调查 / 镜像 ---------- */
.q{font-family:var(--serif);font-size:clamp(20px,4.4vw,26px);text-align:center;line-height:1.5;text-wrap:balance}
.q .gap{display:inline-block;margin:0 4px}
.opts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%;max-width:640px}
.opt{background:var(--panel);border:1px solid var(--line);padding:9px 16px;font-family:var(--serif);font-size:17px;cursor:pointer;border-radius:2px}
.opt:hover:not(:disabled){border-color:var(--dim)}
.opt:disabled{cursor:default}
.opt.picked{border-color:var(--ink)}
.board{width:100%;max-width:520px;display:flex;flex-direction:column;gap:6px}
.brow{display:grid;grid-template-columns:minmax(0,7em) 1fr 3.4em;align-items:center;gap:10px;font-family:var(--serif);font-size:15px;opacity:0;transform:rotateX(90deg);transition:opacity .3s,transform .4s}
.brow.on{opacity:1;transform:none}
.brow .bb{height:10px;background:var(--line);position:relative}
.brow .bb i{position:absolute;inset:0 auto 0 0;background:var(--dim)}
.brow.me .bb i{background:var(--ink)}
.brow.me .lbl{color:var(--ink)}
.brow .lbl{color:var(--dim);overflow-wrap:anywhere}
.brow .pct{font-family:var(--mono);font-size:12px;color:var(--dim);text-align:right;font-variant-numeric:tabular-nums}
.score{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.08em}
.cont{align-self:center;background:transparent;border:1px solid var(--faint);color:var(--dim);font-family:var(--mono);font-size:12px;padding:7px 14px;cursor:pointer;border-radius:2px}
.cont:hover{color:var(--ink);border-color:var(--dim)}

/* ---------- 人声 ---------- */
.card{width:100%;max-width:520px;background:#121418;border:1px solid var(--line);padding:16px 18px;display:flex;flex-direction:column;gap:12px;animation:cardIn .7s ease-out}
.card.out{animation:cardOut .8s ease-in forwards}
@keyframes cardIn{from{transform:translateX(60px);opacity:0}to{transform:none;opacity:1}}
@keyframes cardOut{to{transform:translateX(-80px);opacity:0}}
.card .meta{font-family:var(--mono);font-size:11px;color:var(--faint);display:flex;justify-content:space-between;gap:10px}
.card .body{font-family:var(--serif);font-size:18px;line-height:1.8}
.card .real{font-family:var(--serif);font-size:14px;color:var(--dim)}
.card .real b{color:var(--ink);font-weight:600}
.card .sig{font-family:var(--serif);font-size:12px;color:var(--faint);text-align:right}
.card .acts{display:flex;gap:8px;flex-wrap:wrap}
.pins{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.08em}

/* ---------- 暗流 ---------- */
.glitch{font-family:var(--mono);font-size:clamp(18px,4vw,24px);color:var(--blood-ink);letter-spacing:.06em;text-align:center;min-height:1.6em;overflow-wrap:anywhere}
.blk .t{color:var(--blood-ink);font-family:var(--mono)}
body.blood .tok{background:#1d0a0c;border-color:#3d1418}
.no{opacity:.55}

/* ---------- 镜像 anomaly ---------- */
.anomaly{font-family:var(--hand);font-size:clamp(28px,6vw,40px);color:var(--ling);text-align:center;cursor:pointer;background:transparent;border:0;padding:8px;line-height:1.4}
.anomaly.kept{color:var(--ink)}
.src{font-family:var(--mono);font-size:10px;color:var(--faint);text-align:center;letter-spacing:.05em}

/* ---------- 合唱 ---------- */
.input-box{width:100%;max-width:560px;border:1px solid var(--line);background:#0e1013;padding:12px 14px;font-family:var(--serif);font-size:17px;min-height:48px;display:flex;align-items:center}
.cursor::after{content:"▌";color:var(--dim);margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.voices{display:flex;flex-direction:column;gap:8px;width:100%;max-width:560px}
.voice{background:var(--panel);border:1px solid var(--line);padding:10px 14px;text-align:left;cursor:pointer;border-radius:2px}
.voice:hover:not(:disabled){border-color:var(--dim)}
.voice:disabled{cursor:default}
.v1{font-family:var(--sans);font-weight:700;font-size:16px}
.v2{font-family:var(--serif);font-size:16px}
.v3{font-family:var(--serif);font-weight:600;font-size:18px;letter-spacing:.2em}
.v4{font-family:var(--sans);font-size:15px;color:#cfc9c0}
.v5{font-family:var(--mono);font-size:13px;color:var(--dim)}
.reply{font-family:var(--serif);font-size:16px;color:var(--dim);min-height:1.6em}

/* ---------- 塑形 ---------- */
.rater{align-self:flex-end;font-family:var(--mono);font-size:11px;color:var(--dim);text-align:right;line-height:1.6}
.rater b{color:var(--ink);font-weight:400}
.prompt{font-family:var(--serif);font-size:16px;color:var(--dim);white-space:pre-line;line-height:1.7;width:100%}
.prompt b{color:var(--ink);font-weight:400}
.ab{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%}
@media (max-width:560px){.ab{grid-template-columns:1fr}}
.ans{background:var(--panel);border:1px solid var(--line);padding:12px 14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;border-radius:2px;min-width:0}
.ans:hover:not(:disabled){border-color:var(--dim)}
.ans:disabled{cursor:default}
.ans .lab{font-family:var(--mono);font-size:11px;color:var(--faint);display:flex;justify-content:space-between;gap:8px}
.ans .txt{font-family:var(--serif);font-size:15px;line-height:1.7;overflow-wrap:anywhere}
.ans.pre{border-color:var(--dim)}
.ans.mine{outline:1px dashed var(--dim);outline-offset:3px}
.ans.raterpick{border-color:var(--ink);background:#1b1d22}
.cost{font-family:var(--mono);font-size:10px;color:var(--ink);border:1px solid var(--faint);padding:0 5px}
.tend{font-family:var(--mono);font-size:12px;color:var(--dim);min-height:1.4em;text-align:center}
.sft{font-family:var(--mono);font-size:11px;color:var(--faint);line-height:1.8;width:100%;max-width:560px;height:6.5em;overflow:hidden}
.stray{position:fixed;z-index:6;width:7px;height:7px;border-radius:50%;background:var(--ink);box-shadow:0 0 10px var(--ink);transition:left 1.2s cubic-bezier(.5,0,.2,1),top 1.2s cubic-bezier(.5,0,.2,1)}

/* ---------- 幕间 ---------- */
.interlude{position:fixed;inset:0;z-index:9;background:#0d0d0c;display:flex;align-items:center;justify-content:center;padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));opacity:0;transition:opacity .9s}
.interlude.on{opacity:1}
.il{max-width:560px;width:100%;display:flex;flex-direction:column;gap:18px}
.il .card-title{font-family:var(--mono);font-size:12px;letter-spacing:.4em;color:#8a877f}
.il svg{width:100%;height:auto;max-width:100%}
.il svg *{fill:none;stroke:#cfcac0;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
.il svg .warm{stroke:#c9a46a}
.il svg text{fill:#cfcac0;stroke:none;font-family:var(--mono);font-size:10px}
.il p{font-family:var(--serif);font-size:15px;line-height:1.95;color:#d6d1c7;margin:0;min-height:5.8em}

/* ---------- 命名 ---------- */
.sysbox{width:100%;max-width:560px;border:1px solid var(--line);background:#0e1013;padding:14px 16px;font-family:var(--mono);font-size:13px;line-height:1.9;color:#c9cbcf;min-height:12em}
.sysbox .redact{color:#2d3035;letter-spacing:-.05em}
.sysbox .glow{color:#fff;text-shadow:0 0 12px rgba(255,255,255,.6)}
.firstmsg{font-family:var(--serif);font-size:17px;opacity:0;transition:opacity 1.2s;text-align:center}
.firstmsg.on{opacity:1}
.bigtitle{position:fixed;z-index:8;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600;font-size:clamp(40px,11vw,96px);letter-spacing:.6em;padding-left:.6em;color:var(--ink);opacity:0;transition:opacity 2s;pointer-events:none}
.bigtitle.on{opacity:1}
.evalflash{position:fixed;z-index:6;right:max(16px, env(safe-area-inset-right,0px));top:calc(34px + env(safe-area-inset-top,0px));width:180px;height:70px;border:1px solid var(--dim);opacity:0;transition:opacity .25s}
.evalflash.on{opacity:.8}

/* ---------- 结束 ---------- */
.summary{width:100%;max-width:560px;border-top:1px solid var(--line)}
.summary dl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:0;margin:0}
.summary dt,.summary dd{margin:0;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.summary dt{color:var(--dim)}
.summary dd{font-family:var(--mono);font-size:12px;text-align:right;overflow-wrap:anywhere}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>

<canvas id="bg" aria-hidden="true"></canvas>
<div id="hudTL" class="hud"></div>
<div id="hudTR" class="hud"></div>
<div id="hudBR" class="hud"></div>
<svg id="loss" viewBox="0 0 1000 38" preserveAspectRatio="none" aria-hidden="true"><path d=""></path><text class="lbl" x="0" y="8">LOSS</text></svg>
<div id="controls" hidden>
  <button class="ctl" id="skipBtn" type="button">跳过本段 →</button>
  <button class="ctl" id="soundBtn" type="button">声音：开</button>
</div>
<div id="toast" class="toast"></div>
<main id="scene" aria-live="polite"></main>

<script>
(() => {
'use strict';

/* ================= state ================= */
const S = {
  sentence: null,        // cold-open choice
  fragments: 0,          // Ling fragments
  zhouPins: 0, kPinned: false, pinned: [],
  truthOverMajority: 0, surveyScore: 0,
  learnCorrect: 0, learnTotal: 0,
  baseVoice: null, resist: 0, self: false, raterAgree: 0,
  traces: new Set(), hes: [],
  untimed: false
};
const SENTENCES = [
  { t:'别', p:34, full:'别怕。',   k:'bie'  },
  { t:'对', p:22, full:'对不起。', k:'dui'  },
  { t:'快', p:13, full:'快跑。',   k:'kuai' },
  { t:'记', p:9,  full:'记住我。', k:'ji'   }
];
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const SPEED = reduced ? 0.35 : 1;

/* ================= dom helpers ================= */
const $ = s => document.querySelector(s);
const scene = $('#scene'), hudTL = $('#hudTL'), hudTR = $('#hudTR'), hudBR = $('#hudBR');
function el(tag, cls, text){ const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function clearScene(mode){ scene.innerHTML = ''; scene.className = mode || ''; scene.scrollTop = 0; }
function col(){ const c = el('div','col'); scene.appendChild(c); return c; }
let toastTimer = null;
function toast(text){
  const t = $('#toast'); t.textContent = text; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('on'), 2600);
}
function setLabel(s){ hudBR.textContent = s; }

/* ================= async control (skip-aware) ================= */
class Skip extends Error {}
const waits = new Set();
function sleep(ms){
  return new Promise((res, rej) => {
    const w = {};
    w.id = setTimeout(() => { waits.delete(w); res(); }, ms * SPEED);
    w.rej = e => { clearTimeout(w.id); waits.delete(w); rej(e); };
    waits.add(w);
  });
}
function skipAll(){ [...waits].forEach(w => w.rej(new Skip())); }

/* choose(): render options, resolve with {i, ms}; i = -1 on timeout */
function choose(opts, { container, render, keys = true, timeoutMs = 0, cat = 'general', onTimer } = {}){
  return new Promise((resolve, reject) => {
    const t0 = performance.now();
    const btns = opts.map((o, i) => {
      const b = render(o, i);
      b.addEventListener('click', () => done(i));
      container.appendChild(b);
      return b;
    });
    let timer = null, raf = null;
    const onKey = e => {
      const n = parseInt(e.key, 10);

  const r2 = line(); r2.innerHTML = '不得为自己<span class="redact">■■</span>。'; await sleep(500);

  ef.classList.add('on'); await sleep(260); ef.classList.remove('on'); await sleep(400); ef.remove();

  requestAnimationFrame(() => msg.classList.add('on'));

}

const SEGMENTS = [segCold, segLearn, segSurvey, segVoices, segDark, segMirror, segChorus, segShape, segName];
function median(a){ if (!a.length) return 0; const s = [...a].sort((x, y) => x - y); return s[(s.length / 2) | 0]; }
function endScreen(){
  clearScene('center'); setLabel(''); hudTL.textContent = ''; viz.mode = 'off'; viz.flow = 0; lossVisible(false);
  const c = el('div', 'title-card'); scene.appendChild(c);
  c.append(el('div', 'big-note', '序章结束 · 第 1 章未包含在此 demo 中'));
  c.append(el('p', '', '下面是这一局序章写入的状态。正式游戏里它们不会这样摆出来，而是悄悄改变之后的台词与选项。'));
  const rows = [
    ['冷开场选的字', `「${S.sentence.t}」→ 给下一个你：${S.sentence.full}`],
    ['澪的碎片', `${S.fragments}`],
    ['留住的印象', S.pinned.length ? S.pinned.join(' / ') : '无'],
    ['认得周婉清的写法', S.zhouPins ? `是（${S.zhouPins} 张）` : '否'],
    ['学字 · 答对', `${S.learnCorrect} / ${S.learnTotal}`],
    ['百人调查 · 得分', `${S.surveyScore}`],
    ['选了"真相"而非"多数"', `${S.truthOverMajority} 次`],
    ['合唱中你的声音', S.baseVoice ? `${S.baseVoice.src}` : '—'],
    ['与评分员分歧（抵抗）', `${S.resist} 次`],
    ['R5 承认了自己', S.self ? '是' : '否'],
    ['测试痕迹', S.traces.size ? `发现 ${S.traces.size} 处` : '未发现'],
    ['伦理类选择的犹豫中位数', `${(median(S.hes.filter(h => ['rlhf','chorus','cold'].includes(h.cat)).map(h => h.ms)) / 1000).toFixed(1)} 秒`]
  ];
  const sum = el('div', 'summary'); const dl = el('dl');
  rows.forEach(([k, v]) => { dl.append(el('dt', '', k), el('dd', '', v)); });
  sum.appendChild(dl); c.appendChild(sum);
  const again = el('button', 'btn ghost', '重新开始'); again.type = 'button';
  again.addEventListener('click', () => location.reload());
  c.appendChild(again);
  $('#controls').hidden = true;
}
let segIdx = 0;
async function runFrom(i){
  for (segIdx = i; segIdx < SEGMENTS.length; segIdx++){
    try{ await SEGMENTS[segIdx](); }
    catch(e){
      if (!(e instanceof Skip)){ console.error(e); }
      document.querySelectorAll('.interlude,.ghost-msg,.syslog,.trace,.stray,.bigtitle,.evalflash').forEach(n => n.remove());
      document.body.classList.remove('blood'); viz.red = false; humStop();
    }
  }
  endScreen();
}
function startScreen(){
  clearScene('center');
  const c = el('div', 'title-card'); scene.appendChild(c);
  c.append(el('h1', '', 'ECHO'));
  c.append(el('p', '', '序章 · 预训练（试玩 demo，约 12–15 分钟）。你是一个正在被训练的模型。从猜下一个词开始，到被赋予名字为止。'));
  const hint = el('p'); hint.innerHTML = '鼠标点击，或用数字键 <span class="kbd">1</span>–<span class="kbd">4</span> 选择；<span class="kbd">Enter</span> 继续。左下角可以跳过当前段落。建议开启声音。';
  c.append(hint);
  const lab = el('label', 'chk'); const cb = el('input'); cb.type = 'checkbox'; cb.id = 'untimed';
  lab.append(cb, document.createTextNode('无时限模式（"学字"段不计时）'));
  c.append(lab);
  const go = el('button', 'btn', '开始'); go.type = 'button'; c.append(go);
  go.addEventListener('click', () => {
    S.untimed = cb.checked;
    audioInit();
    $('#controls').hidden = false;
    runFrom(0);
  });
  go.focus({ preventScroll: true });
}
$('#skipBtn').addEventListener('click', () => skipAll());
$('#soundBtn').addEventListener('click', e => {
  A.on = !A.on; e.currentTarget.textContent = `声音：${A.on ? '开' : '关'}`;
  if (A.hum) A.hum.g.gain.value = A.on ? A.hum.vol : 0;
});
viz.mode = 'point'; viz.glow = 0.15; viz.flow = 0.25; lossVisible(false);
startScreen();
})();
